minReportsCommon.normalizeFilterValue(logFilter.value);if(!q){return rows;}return rows.filter((row)=>[row.officer_name,row.guest_id,row.accessed_at].filter(Boolean).some((value)=>superAdminReportsCommon.normalizeFilterValue(value).includes(q)));}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} police access row${filtered.length===1?"":"s"} loaded.`;superAdminReportsCommon.renderTable(tableBox,filtered.map((row)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean-950">${row.officer_name||"-"}</td><td class="px-3 py-3 text-slate-600">${row.guest_id||"-"}</td><td class="px-3 py-3 text-slate-600">${row.accessed_at||"-"}</td>`;return tr;}),3,"No police access logs found.");}async function loadSection(){superAdminReportsCommon.clearMessage(statusBox);const data=await superAdminReportsCommon.loadHotelReport({tokenInput,viewerNameInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.police_access_logs||[]);}loadButton.addEventListener("click",async()=>{superAdminReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load report","error");}finally{superAdminReportsCommon.setButtonLoading(loadButton,false);}});exportButton.addEventListener("click",()=>{if(!lastData?.reports?.police_access_logs?.length){superAdminReportsCommon.setMessage(statusBox,"There is no data to export yet.","error");return;}const rows=[["Officer Name","Guest ID","Accessed At"]];for(const row of filteredRows(lastData.reports.police_access_logs)){rows.push([row.officer_name,row.guest_id,row.accessed_at]);}superAdminReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-police-access-logs.csv`,rows);});logFilter.addEventListener("input",()=>{if(lastData?.reports?.police_access_logs){renderRows(lastData.reports.police_access_logs);}});i
