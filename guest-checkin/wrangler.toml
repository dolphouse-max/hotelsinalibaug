name = "hotelsinalibaug"
compatibility_date = "2026-07-14"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "alibaug-checkin-db"
database_id = "b33c9905-3cba-4303-b8df-ff90569b343d"

# Add these as Cloudflare Pages secrets or variables in the dashboard:
# API_READ_TOKEN
# ENCRYPTION_KEY
# SESSION_SECRET
# FIREBASE_PROJECT_ID
# VAPID_PUBLIC_KEY
# VAPID_PRIVATE_KEY
# VAPID_SUBJECT
# MSG91_AUTH_KEY (or MSG91_SMS_AUTH_KEY)
