<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17324a">
    <title>Website Inquiries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="hotel-admin-common.js?v=20260725-2"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ocean: "#0b1824", harbor: "#17324a", shell: "#f6efe3" } } } };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div class="flex items-center justify-between text-sm">
        <a href="/hotel-admin-home.html" class="font-medium text-slate-600">Back to Home</a>
        <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Inquiries</span>
      </div>
      <script>document.write(hotelAdminCommon.quickNav("inquiries"));</script>

      <section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white">
          <h1 class="text-2xl font-semibold">Website Inquiries</h1>
          <p class="mt-2 text-sm leading-6 text-white/80">Review every inquiry received from your public hotel webpage and contact guests directly from here.</p>
        </div>
        <div class="p-5 space-y-4">
          <div>
            <label for="hotelAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Hotel Admin Token</label>
            <input id="hotelAdminToken" type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
          </div>
          <div>
            <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel ID</label>
            <input id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
          </div>
          <div>
            <label for="searchInput" class="mb-2 block text-sm font-medium text-slate-700">Search Guest Name, Mobile, or Message</label>
            <input id="searchInput" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Search inquiries">
          </div>
          <button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Inquiries</button>
          <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
        </div>
      </section>

      <section class="mt-5 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div id="inquiriesState" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load your website inquiries.</div>
        <div id="inquiriesList" class="mt-4 grid gap-3"></div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("hotelAdminToken");
      const hotelIdInput = document.getElementById("hotelId");
      const searchInput = document.getElementById("searchInput");
      const loadButton = document.getElementById("loadButton");
      const pageMessage = document.getElementById("pageMessage");
      const inquiriesState = document.getElementById("inquiriesState");
      const inquiriesList = document.getElementById("inquiriesList");
      let allInquiries = [];

      const inquiryTranslations = {
        en: {
          title: "Website Inquiries",
          back: "Back to Home",
          badge: "Inquiries",
          heroTitle: "Website Inquiries",
          heroBody: "Review every inquiry received from your public hotel webpage and contact guests directly from here.",
          sessionLabel: "Session",
          hotelIdLabel: "Hotel ID",
          searchLabel: "Search Guest Name, Mobile, or Message",
          searchPlaceholder: "Search inquiries",
          loadButton: "Load Inquiries",
          initialState: "Load your website inquiries.",
          noMatch: "No inquiries match this search.",
          noData: "No website inquiries yet.",
          shown: (count) => `${count} inquir${count === 1 ? "y" : "ies"} shown.`,
          callGuest: "Call Guest",
          checkin: "Check-in",
          checkout: "Check-out",
          persons: "Persons",
          roomType: "Room Type",
          page: "Page",
          enterHotel: "Enter hotel ID first.",
          loadError: "Unable to load inquiries.",
          loading: "Loading...",
        },
        mr: {
          title: "वेबसाइट चौकशी",
          back: "मुख्यपृष्ठावर परत",
          badge: "चौकशी",
          heroTitle: "वेबसाइट चौकशी",
          heroBody: "आपल्या सार्वजनिक हॉटेल वेबपानावरून आलेली प्रत्येक चौकशी येथे पाहा आणि पाहुण्यांशी थेट संपर्क साधा.",
          sessionLabel: "सेशन",
          hotelIdLabel: "हॉटेल आयडी",
          searchLabel: "पाहुण्याचे नाव, मोबाइल किंवा संदेश शोधा",
          searchPlaceholder: "चौकशी शोधा",
          loadButton: "चौकशी लोड करा",
          initialState: "आपल्या वेबसाइट चौकशा लोड करा.",
          noMatch: "या शोधासाठी कोणतीही चौकशी मिळाली नाही.",
          noData: "अद्याप कोणतीही वेबसाइट चौकशी नाही.",
          shown: (count) => `${count} चौकशी दाखवली आहे.`,
          callGuest: "पाहुण्याला कॉल करा",
          checkin: "चेक-इन",
          checkout: "चेक-आउट",
          persons: "व्यक्ती",
          roomType: "रूम प्रकार",
          page: "पान",
          enterHotel: "सर्वप्रथम हॉटेल आयडी टाका.",
          loadError: "चौकशी लोड करता आली नाही.",
          loading: "लोड होत आहे...",
        },
      };

      function getInquiryText() {
        return inquiryTranslations[hotelAdminCommon.getLanguage()] || inquiryTranslations.en;
      }

      function applyInquiryLanguage() {
        const text = getInquiryText();
        document.title = text.title;
        document.querySelector("a[href='/hotel-admin-home.html']").textContent = text.back;
        document.querySelector(".rounded-full.bg-white").textContent = text.badge;
        document.querySelector("h1.text-2xl").textContent = text.heroTitle;
        document.querySelector("h1.text-2xl + p").textContent = text.heroBody;
        document.querySelector("label[for='hotelAdminToken']").textContent = text.sessionLabel;
        document.querySelector("label[for='hotelId']").textContent = text.hotelIdLabel;
        document.querySelector("label[for='searchInput']").textContent = text.searchLabel;
        searchInput.placeholder = text.searchPlaceholder;
        loadButton.textContent = text.loadButton;
        inquiriesState.textContent = text.initialState;
      }

      hotelAdminCommon.hydrateContext(tokenInput, hotelIdInput);
      applyInquiryLanguage();

      function renderInquiries() {
        const text = getInquiryText();
        const query = searchInput.value.trim().toLowerCase();
        const filtered = !query
          ? allInquiries
          : allInquiries.filter((item) =>
              [item.guest_name, item.guest_phone, item.guest_message, item.page_title_snapshot]
                .filter(Boolean)
                .some((value) => String(value).toLowerCase().includes(query))
            );

        inquiriesList.innerHTML = "";
        if (!filtered.length) {
          inquiriesState.textContent = allInquiries.length ? text.noMatch : text.noData;
          return;
        }

        inquiriesState.textContent = text.shown(filtered.length);
        for (const inquiry of filtered) {
          const card = document.createElement("article");
          card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-4";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="font-semibold text-slate-900">${inquiry.guest_name}</p>
                <p class="mt-1 text-xs uppercase tracking-[0.16em] text-slate-500">${inquiry.guest_phone}</p>
              </div>
              <a href="tel:${inquiry.guest_phone}" class="rounded-2xl bg-ocean px-4 py-2 text-sm font-semibold text-white">${text.callGuest}</a>
            </div>
            <div class="mt-3 grid grid-cols-2 gap-2 text-xs text-slate-500">
              <p><strong>${text.checkin}:</strong> ${inquiry.check_in_date || "-"}</p>
              <p><strong>${text.checkout}:</strong> ${inquiry.check_out_date || "-"}</p>
              <p><strong>${text.persons}:</strong> ${inquiry.total_persons || "-"}</p>
              <p><strong>${text.roomType}:</strong> ${inquiry.requested_room_type || "-"}</p>
            </div>
            <p class="mt-3 text-sm text-slate-700">${inquiry.guest_message}</p>
            <p class="mt-3 text-xs text-slate-500">${text.page}: ${inquiry.page_title_snapshot || inquiry.public_page_slug || "-"} • ${inquiry.created_at}</p>
          `;
          inquiriesList.appendChild(card);
        }
      }

      async function loadInquiries() {
        const hotelId = hotelAdminCommon.safeHotelId(hotelIdInput);
        if (!hotelId) {
          throw new Error(getInquiryText().enterHotel);
        }

        const url = new URL("/api/hotel-admin/inquiries", window.location.origin);
        url.searchParams.set("hotel_id", hotelId);
        if (searchInput.value.trim()) {
          url.searchParams.set("q", searchInput.value.trim());
        }

        const response = await fetch(url.toString(), {
          headers: hotelAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await hotelAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || getInquiryText().loadError);
        }
        allInquiries = data.inquiries || [];
        renderInquiries();
      }

      loadButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(pageMessage);
        hotelAdminCommon.setButtonLoading(loadButton, true, getInquiryText().loading);
        try {
          await loadInquiries();
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message || getInquiryText().loadError, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(loadButton, false);
        }
      });

      searchInput.addEventListener("input", renderInquiries);
    </script>
  </body>
</html>
