<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Reports Redirect</title>
      <link rel="stylesheet" href="/three-d-surfaces.css">
  </head>
  <body>
    <script>
      const redirectUrl = new URL("hotel-reports-home.html", window.location.href);
      if (!redirectUrl.searchParams.get("hotel_id")) {
        const currentUrl = new URL(window.location.href);
        const hotelId =
          currentUrl.searchParams.get("hotel_id") ||
          localStorage.getItem("hotel_admin_hotel_id") ||
          localStorage.getItem("dashboard_hotel_id") ||
          "";
        if (hotelId) {
          redirectUrl.searchParams.set("hotel_id", hotelId);
        }
      }
      window.location.replace(redirectUrl.toString());
    </script>
  </body>
</html>
