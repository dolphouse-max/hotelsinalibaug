<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Admin Setup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-common.js?v=20260718-1"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: {
                950: "#08131d",
                900: "#0f2436",
                800: "#17344d",
              },
              coral: "#d98d63",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminCommon.pageChrome("Access Setup", "Setup", "Use this page after password login to keep the superadmin session ready on this device."));
      </script>
        <script>
          document.write(superAdminCommon.quickNav("setup"));
        </script>
        <div class="p-5">
          <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Log in once from the Super Admin Home page, then the rest of the superadmin pages can reuse the same session automatically.
          </div>
          <div class="space-y-4">
            <div>
              <label for="superAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Session</label>
              <input id="superAdminToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Saved superadmin session">
            </div>
            <button id="saveTokenButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">
              Save Session On This Device
            </button>
            <button id="verifyTokenButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">
              Verify Access By Loading Hotels
            </button>
            <div id="tokenStatus" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const saveTokenButton = document.getElementById("saveTokenButton");
      const verifyTokenButton = document.getElementById("verifyTokenButton");
      const tokenStatus = document.getElementById("tokenStatus");

      superAdminCommon.restoreToken(tokenInput);
      if (tokenInput.value) {
        superAdminCommon.setMessage(tokenStatus, "Saved session found on this device. You can verify access anytime.", "success");
      }

      saveTokenButton.addEventListener("click", () => {
        superAdminCommon.saveToken(tokenInput);
        superAdminCommon.setMessage(tokenStatus, "Superadmin session saved on this device.", "success");
      });

      verifyTokenButton.addEventListener("click", async () => {
        superAdminCommon.clearMessage(tokenStatus);
        superAdminCommon.setButtonLoading(verifyTokenButton, true, "Verifying...");
        try {
          const response = await fetch("/api/super-admin/manage-hotel", {
            headers: superAdminCommon.authHeaders(tokenInput),
          });
          const data = await superAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || "Unable to verify access");
          }
          superAdminCommon.saveToken(tokenInput);
          superAdminCommon.setMessage(tokenStatus, `Access verified. ${data.hotels?.length || 0} hotel accounts are accessible.`, "success");
        } catch (error) {
          superAdminCommon.setMessage(tokenStatus, error instanceof Error ? error.message : "Unable to verify access", "error");
        } finally {
          superAdminCommon.setButtonLoading(verifyTokenButton, false);
        }
      });
    </script>
  </body>
</html>
