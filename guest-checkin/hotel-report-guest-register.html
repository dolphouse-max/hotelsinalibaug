<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest Register</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js?v=20260725-2"></script><script src="hotel-reports-common.js?v=20260718-1"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script></head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a id="backLink" href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span id="badge" class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Register</span></div><script>document.write(hotelReportsCommon.quickNav("register"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 id="heroTitle" class="text-2xl font-semibold">Guest Register</h1><p id="heroBody" class="mt-2 text-sm leading-6 text-white/80">Search the guest register and export only the filtered rows.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="guestFilter" placeholder="Search guest, phone, room, ID type, or ID number" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th id="thGuest" class="px-3 py-2 font-medium">Guest</th><th id="thRoom" class="px-3 py-2 font-medium">Room</th><th id="thPhone" class="px-3 py-2 font-medium">Phone</th><th id="thId" class="px-3 py-2 font-medium">ID</th><th id="thCheckIn" class="px-3 py-2 font-medium">Check-In</th><th id="thCheckOut" class="px-3 py-2 font-medium">Check-Out</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=null,hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),guestFilter=document.getElementById("guestFilter"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let lastData=null;const pageText={en:{title:"Guest Register",back:"Back to Reports Home",badge:"Register",heroTitle:"Guest Register",heroBody:"Search the guest register and export only the filtered rows.",hotelId:"Hotel ID",load:"Load Report",export:"Export CSV",filter:"Search guest, phone, room, ID type, or ID number",emptyStart:"No data loaded yet.",rows:(c)=>`${c} guest register row${c===1?"":"s"} loaded.`,empty:"No guest register rows found.",noExport:"There is no data to export yet.",guest:"Guest",room:"Room",phone:"Phone",id:"ID",checkIn:"Check-In",checkOut:"Check-Out",guestName:"Guest Name",roomNumber:"Room Number",idType:"ID Type",idNumber:"ID Number",loading:"Loading...",error:"Unable to load report"},mr:{title:"गेस्ट रजिस्टर",back:"रिपोर्ट्स मुख्यपृष्ठावर परत",badge:"रजिस्टर",heroTitle:"गेस्ट रजिस्टर",heroBody:"गेस्ट रजिस्टर शोधा आणि फक्त फिल्टर केलेल्या नोंदी निर्यात करा.",hotelId:"हॉटेल आयडी",load:"रिपोर्ट लोड करा",export:"सीएसव्ही निर्यात",filter:"गेस्ट, फोन, रूम, ओळखपत्र प्रकार किंवा क्रमांक शोधा",emptyStart:"अजून माहिती लोड केलेली नाही.",rows:(c)=>`${c} गेस्ट रजिस्टर नोंदी लोड झाल्या.`,empty:"गेस्ट रजिस्टरमध्ये कोणतीही नोंद सापडली नाही.",noExport:"निर्यात करण्यासाठी अजून माहिती नाही.",guest:"गेस्ट",room:"रूम",phone:"फोन",id:"ओळखपत्र",checkIn:"चेक-इन",checkOut:"चेक-आउट",guestName:"गेस्ट नाव",roomNumber:"रूम क्रमांक",idType:"ओळखपत्र प्रकार",idNumber:"ओळखपत्र क्रमांक",loading:"लोड होत आहे...",error:"रिपोर्ट लोड करता आला नाही"}};hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);function t(){return pageText[hotelAdminCommon.getLanguage()]||pageText.en;}function applyLanguage(){const x=t();document.title=x.title;backLink.textContent=x.back;badge.textContent=x.badge;heroTitle.textContent=x.heroTitle;heroBody.textContent=x.heroBody;hotelIdInput.placeholder=x.hotelId;guestFilter.placeholder=x.filter;thGuest.textContent=x.guest;thRoom.textContent=x.room;thPhone.textContent=x.phone;thId.textContent=x.id;thCheckIn.textContent=x.checkIn;thCheckOut.textContent=x.checkOut;if(!loadButton.dataset.loading){loadButton.textContent=x.load;}exportButton.textContent=x.export;if(!lastData){stateBox.textContent=x.emptyStart;}}function normalize(v){return String(v||"").trim().toLowerCase();}function filteredRows(rows){const q=normalize(guestFilter.value);if(!q){return rows;}return rows.filter((guest)=>[guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number].filter(Boolean).some((value)=>normalize(value).includes(q)));}function renderRows(rows){const x=t(),filtered=filteredRows(rows);stateBox.textContent=x.rows(filtered.length);hotelReportsCommon.renderTable(tableBox,filtered.map((guest)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean">${guest.name}</td><td class="px-3 py-3 text-slate-600">${guest.room_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.id_type||"-"} / ${guest.id_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_in_time||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_out_time||"-"}</td>`;return tr;}),6,x.empty);}async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.guest_register||[]);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,t().loading);try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:t().error,"error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);loadButton.textContent=t().load;}});exportButton.addEventListener("click",()=>{const x=t();if(!lastData?.reports?.guest_register?.length){hotelReportsCommon.setMessage(messageBox,x.noExport,"error");return;}const rows=[[x.guestName,x.roomNumber,x.phone,x.idType,x.idNumber,x.checkIn,x.checkOut]];for(const guest of filteredRows(lastData.reports.guest_register)){rows.push([guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number,guest.check_in_time,guest.check_out_time]);}hotelReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-guest-register.csv`,rows);});guestFilter.addEventListener("input",()=>{if(lastData?.reports?.guest_register){renderRows(lastData.reports.guest_register);}});document.addEventListener("click",(event)=>{if(event.target instanceof HTMLElement&&event.target.closest(".hotel-language-button")){window.setTimeout(()=>{applyLanguage();if(lastData?.reports?.guest_register){renderRows(lastData.reports.guest_register);}},0);}});applyLanguage();if(hotelIdInput.value.trim()){loadButton.click();}</script></body></html>
