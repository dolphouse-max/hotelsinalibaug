<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Guest Register</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js?v=20260718-1"></script><script src="hotel-reports-common.js?v=20260718-1"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script></head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Register</span></div><script>document.write(hotelReportsCommon.quickNav("register"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 class="text-2xl font-semibold">Guest Register</h1><p class="mt-2 text-sm leading-6 text-white/80">Search the guest register and export only the filtered rows.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="guestFilter" placeholder="Search guest, phone, room, ID type, or ID number" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th class="px-3 py-2 font-medium">Guest</th><th class="px-3 py-2 font-medium">Room</th><th class="px-3 py-2 font-medium">Phone</th><th class="px-3 py-2 font-medium">ID</th><th class="px-3 py-2 font-medium">Check-In</th><th class="px-3 py-2 font-medium">Check-Out</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=null,hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),guestFilter=document.getElementById("guestFilter"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let lastData=null;hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);function normalize(v){return String(v||"").trim().toLowerCase();}function filteredRows(rows){const q=normalize(guestFilter.value);if(!q){return rows;}return rows.filter((guest)=>[guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number].filter(Boolean).some((value)=>normalize(value).includes(q)));}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} guest register row${filtered.length===1?"":"s"} loaded.`;hotelReportsCommon.renderTable(tableBox,filtered.map((guest)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean">${guest.name}</td><td class="px-3 py-3 text-slate-600">${guest.room_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.id_type||"-"} / ${guest.id_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_in_time||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_out_time||"-"}</td>`;return tr;}),6,"No guest register rows found.");}async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.guest_register||[]);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:"Unable to load report","error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);}});exportButton.addEventListener("click",()=>{if(!lastData?.reports?.guest_register?.length){hotelReportsCommon.setMessage(messageBox,"There is no data to export yet.","error");return;}const rows=[["Guest Name","Room Number","Phone","ID Type","ID Number","Check In","Check Out"]];for(const guest of filteredRows(lastData.reports.guest_register)){rows.push([guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number,guest.check_in_time,guest.check_out_time]);}hotelReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-guest-register.csv`,rows);});guestFilter.addEventListener("input",()=>{if(lastData?.reports?.guest_register){renderRows(lastData.reports.guest_register);}});if(hotelIdInput.value.trim()){loadButton.click();}</script></body></html>
