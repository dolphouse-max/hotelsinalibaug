<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Police Logs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-reports-common.js?v=20260718-1"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: { 950: "#08131d", 900: "#0f2436", 800: "#17344d" },
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminReportsCommon.pageChrome("Police Access Logs", "Police", "Review which officers accessed hotel guest records and export the current log slice as CSV."));
      </script>
        <script>
          document.write(superAdminReportsCommon.quickNav("police"));
        </script>
        <div class="p-5">
          <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Search by officer, hotel, or guest when the access log grows large.
          </div>
          <div class="space-y-4">
            <div>
              <label for="superAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Super Admin Token</label>
              <input id="superAdminToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-ocean-800 focus:ring-4 focus:ring-ocean-800/10">
            </div>
            <div>
              <label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label>
              <input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-800 focus:ring-4 focus:ring-ocean-800/10">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-800 focus:ring-4 focus:ring-ocean-800/10">
              <input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-800 focus:ring-4 focus:ring-ocean-800/10">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Load Report</button>
              <button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button>
            </div>
            <div>
              <label for="policeFilter" class="mb-2 block text-sm font-medium text-slate-700">Search Log</label>
              <input id="policeFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-800 focus:ring-4 focus:ring-ocean-800/10" placeholder="Search by officer, hotel, guest, or hotel ID">
            </div>
            <div id="errorBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>

          <p id="policeState" class="mt-5 text-sm text-slate-600">No data loaded yet.</p>
          <div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white">
            <table class="min-w-full text-left text-sm">
              <thead class="text-slate-500">
                <tr>
                  <th class="px-3 py-2 font-medium">Officer</th>
                  <th class="px-3 py-2 font-medium">Hotel</th>
                  <th class="px-3 py-2 font-medium">Guest</th>
                  <th class="px-3 py-2 font-medium">Accessed At</th>
                </tr>
              </thead>
              <tbody id="policeTable" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const viewerNameInput = document.getElementById("viewerName");
      const fromDateInput = document.getElementById("fromDate");
      const toDateInput = document.getElementById("toDate");
      const loadButton = document.getElementById("loadButton");
      const exportButton = document.getElementById("exportButton");
      const policeFilterInput = document.getElementById("policeFilter");
      const errorBox = document.getElementById("errorBox");
      const policeState = document.getElementById("policeState");
      const policeTable = document.getElementById("policeTable");
      let lastReportData = null;

      superAdminReportsCommon.hydrateFilters(tokenInput, viewerNameInput, fromDateInput, toDateInput);

      function normalizeFilterValue(value) {
        return String(value || "").trim().toLowerCase();
      }

      function applyPoliceFilter(logs) {
        const filterValue = normalizeFilterValue(policeFilterInput.value);
        if (!filterValue) {
          return logs;
        }

        return logs.filter((log) =>
          [log.officer_name, log.hotel_name, log.hotel_id, log.guest_name, log.guest_id]
            .filter(Boolean)
            .some((value) => normalizeFilterValue(value).includes(filterValue))
        );
      }

      function renderPoliceLogs(logs) {
        const filteredLogs = applyPoliceFilter(logs);
        policeState.textContent = `${filteredLogs.length} police access row${filteredLogs.length === 1 ? "" : "s"} loaded.`;
        superAdminReportsCommon.renderTable(
          policeTable,
          filteredLogs.map((log) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="px-3 py-3 font-medium text-ocean-950">${log.officer_name}</td>
              <td class="px-3 py-3 text-slate-600">${log.hotel_name} (${log.hotel_id})</td>
              <td class="px-3 py-3 text-slate-600">${log.guest_name || log.guest_id}</td>
              <td class="px-3 py-3 text-slate-600">${log.accessed_at}</td>
            `;
            return tr;
          }),
          4,
          "No police access logs found."
        );
      }

      async function loadReport() {
        superAdminReportsCommon.clearMessage(errorBox);
        const data = await superAdminReportsCommon.loadReports({ tokenInput, viewerNameInput, fromDateInput, toDateInput });
        lastReportData = data;
        renderPoliceLogs(data.reports.police_access_logs || []);
      }

      loadButton.addEventListener("click", async () => {
        superAdminReportsCommon.setButtonLoading(loadButton, true, "Loading...");
        try {
          await loadReport();
        } catch (error) {
          superAdminReportsCommon.setMessage(errorBox, error instanceof Error ? error.message : "Unable to load report", "error");
        } finally {
          superAdminReportsCommon.setButtonLoading(loadButton, false);
        }
      });

      exportButton.addEventListener("click", () => {
        if (!lastReportData?.reports?.police_access_logs?.length) {
          superAdminReportsCommon.setMessage(errorBox, "There is no data to export yet.", "error");
          return;
        }
        const rows = [["Officer Name", "Hotel Name", "Hotel ID", "Guest Name", "Guest ID", "Accessed At"]];
        for (const log of applyPoliceFilter(lastReportData.reports.police_access_logs)) {
          rows.push([log.officer_name, log.hotel_name, log.hotel_id, log.guest_name, log.guest_id, log.accessed_at]);
        }
        superAdminReportsCommon.downloadCsv("police-access-logs.csv", rows);
      });

      policeFilterInput.addEventListener("input", () => {
        if (!lastReportData?.reports?.police_access_logs) {
          return;
        }
        renderPoliceLogs(lastReportData.reports.police_access_logs);
      });
    </script>
  </body>
</html>
