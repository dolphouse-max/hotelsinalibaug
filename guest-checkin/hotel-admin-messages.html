<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17324a">
    <title>Hotel Messages</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="hotel-admin-common.js"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ocean: "#0b1824", harbor: "#17324a", shell: "#f6efe3" } } } };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div class="flex items-center justify-between text-sm">
        <a href="/hotel-admin-home.html" class="font-medium text-slate-600">Back to Home</a>
        <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Messages</span>
      </div>
      <script>document.write(hotelAdminCommon.quickNav("messages"));</script>

      <section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white">
          <h1 class="text-2xl font-semibold">Hotel Messages</h1>
          <p class="mt-2 text-sm leading-6 text-white/80">Send quick coordination messages to other hotels about room availability, overflow guests, and basic support.</p>
        </div>
        <div class="p-5">
          <div class="space-y-4">
            <div>
              <label for="hotelAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Hotel Admin Token</label>
              <input id="hotelAdminToken" type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
            </div>
            <div>
              <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel ID</label>
              <input id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
            </div>
            <button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Messages</button>
            <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>
        </div>
      </section>

      <section class="mt-5 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <h2 class="text-lg font-semibold text-ocean">Start New Conversation</h2>
        <div class="mt-4 space-y-3">
          <input id="hotelSearch" placeholder="Search hotel by name or ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
          <select id="recipientHotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
            <option value="">Select hotel</option>
          </select>
          <textarea id="newMessageText" rows="4" placeholder="Example: Do you have 2 AC rooms available tonight for overflow guests?" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></textarea>
          <button id="sendButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Send Message</button>
        </div>
      </section>

      <section class="mt-5 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <h2 class="text-lg font-semibold text-ocean">Conversations</h2>
        <div id="threadsState" class="mt-4 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load your conversations.</div>
        <div id="threadsList" class="mt-4 grid gap-3"></div>
      </section>

      <section class="mt-5 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-lg font-semibold text-ocean">Thread View</h2>
          <span id="activeThreadBadge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500">No thread</span>
        </div>
        <div id="messagesState" class="mt-4 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Select a conversation to view messages.</div>
        <div id="messagesList" class="mt-4 grid gap-3"></div>
        <div class="mt-4 space-y-3">
          <textarea id="replyMessageText" rows="3" placeholder="Type a reply in this thread" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></textarea>
          <button id="replyButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-slate-900 px-5 py-3 font-semibold text-white">Send Reply</button>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("hotelAdminToken");
      const hotelIdInput = document.getElementById("hotelId");
      const pageMessage = document.getElementById("pageMessage");
      const loadButton = document.getElementById("loadButton");
      const sendButton = document.getElementById("sendButton");
      const replyButton = document.getElementById("replyButton");
      const recipientHotelId = document.getElementById("recipientHotelId");
      const hotelSearch = document.getElementById("hotelSearch");
      const threadsList = document.getElementById("threadsList");
      const threadsState = document.getElementById("threadsState");
      const messagesList = document.getElementById("messagesList");
      const messagesState = document.getElementById("messagesState");
      const activeThreadBadge = document.getElementById("activeThreadBadge");

      let directory = [];
      let threads = [];
      let activeThreadId = "";
      let activeRecipientHotelId = "";
      let activeRecipientHotelName = "";

      hotelAdminCommon.hydrateContext(tokenInput, hotelIdInput);

      function fillDirectoryOptions(items) {
        recipientHotelId.innerHTML = '<option value="">Select hotel</option>';
        for (const hotel of items) {
          const option = document.createElement("option");
          option.value = hotel.id;
          option.textContent = `${hotel.name} (${hotel.id})`;
          recipientHotelId.appendChild(option);
        }
      }

      function applyHotelSearch() {
        const query = hotelSearch.value.trim().toLowerCase();
        const filtered = !query
          ? directory
          : directory.filter((hotel) =>
              [hotel.name, hotel.id].some((value) => String(value).toLowerCase().includes(query))
            );
        fillDirectoryOptions(filtered);
      }

      function renderThreads() {
        threadsList.innerHTML = "";
        if (!threads.length) {
          threadsState.textContent = "No conversations yet.";
          return;
        }

        threadsState.textContent = `${threads.length} conversation${threads.length === 1 ? "" : "s"} loaded.`;
        for (const thread of threads) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left";
          card.innerHTML = `
            <div class="flex items-center justify-between gap-3">
              <div>
                <p class="font-semibold text-slate-900">${thread.other_hotel_name}</p>
                <p class="mt-1 text-xs uppercase tracking-[0.16em] text-slate-500">${thread.other_hotel_id}</p>
              </div>
              <span class="rounded-full ${Number(thread.unread_count) > 0 ? "bg-amber-100 text-amber-800" : "bg-white text-slate-500"} px-3 py-1 text-xs font-semibold">
                ${Number(thread.unread_count) > 0 ? `${thread.unread_count} new` : "Seen"}
              </span>
            </div>
            <p class="mt-3 text-sm leading-6 text-slate-600">${thread.latest_message_text || "No messages yet"}</p>
            <p class="mt-2 text-xs text-slate-500">Last update: ${thread.latest_message_created_at || thread.last_message_at}</p>
          `;
          card.addEventListener("click", async () => {
            activeThreadId = thread.id;
            activeRecipientHotelId = thread.other_hotel_id;
            activeRecipientHotelName = thread.other_hotel_name;
            await loadMessages(thread.id);
          });
          threadsList.appendChild(card);
        }
      }

      function renderMessages(messages) {
        messagesList.innerHTML = "";
        if (!messages.length) {
          messagesState.textContent = "No messages yet in this conversation.";
          return;
        }

        messagesState.textContent = `${messages.length} message${messages.length === 1 ? "" : "s"} loaded.`;
        for (const message of messages) {
          const mine = message.sender_hotel_id === hotelIdInput.value.trim();
          const card = document.createElement("article");
          card.className = `rounded-2xl p-4 text-sm ${mine ? "border border-sky-200 bg-sky-50" : "border border-slate-200 bg-slate-50"}`;
          card.innerHTML = `
            <p class="font-semibold ${mine ? "text-sky-900" : "text-slate-900"}">${message.sender_hotel_name}${mine ? " (You)" : ""}</p>
            <p class="mt-2 leading-6 ${mine ? "text-sky-900" : "text-slate-700"}">${message.message_text}</p>
            <p class="mt-2 text-xs ${mine ? "text-sky-700" : "text-slate-500"}">${message.created_at}</p>
          `;
          messagesList.appendChild(card);
        }
      }

      async function loadInbox(threadId = "") {
        hotelAdminCommon.persistContext(tokenInput.value.trim(), hotelIdInput.value.trim());
        const url = new URL("/api/hotel-admin/messages", window.location.origin);
        url.searchParams.set("hotel_id", hotelIdInput.value.trim());
        if (threadId) {
          url.searchParams.set("thread_id", threadId);
        }

        const response = await fetch(url.toString(), {
          headers: hotelAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await hotelAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || "Unable to load messages");
        }

        directory = data.directory || [];
        threads = data.threads || [];
        applyHotelSearch();
        renderThreads();
        return data;
      }

      async function loadMessages(threadId) {
        const data = await loadInbox(threadId);
        activeThreadBadge.textContent = activeRecipientHotelName || "Thread";
        renderMessages(data.messages || []);

        await fetch("/api/hotel-admin/messages", {
          method: "POST",
          headers: hotelAdminCommon.authHeaders(tokenInput),
          body: JSON.stringify({
            action: "mark_thread_read",
            hotel_id: hotelIdInput.value.trim(),
            thread_id: threadId,
          }),
        });

        const refreshed = await loadInbox(threadId);
        renderMessages(refreshed.messages || []);
      }

      loadButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(pageMessage);
        hotelAdminCommon.setButtonLoading(loadButton, true, "Loading...");
        try {
          activeThreadId = "";
          activeRecipientHotelId = "";
          activeRecipientHotelName = "";
          activeThreadBadge.textContent = "No thread";
          messagesList.innerHTML = "";
          messagesState.textContent = "Select a conversation to view messages.";
          await loadInbox();
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(loadButton, false);
        }
      });

      sendButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(pageMessage);
        hotelAdminCommon.setButtonLoading(sendButton, true, "Sending...");
        try {
          const response = await fetch("/api/hotel-admin/messages", {
            method: "POST",
            headers: hotelAdminCommon.authHeaders(tokenInput),
            body: JSON.stringify({
              action: "send_message",
              hotel_id: hotelIdInput.value.trim(),
              recipient_hotel_id: recipientHotelId.value,
              message_text: document.getElementById("newMessageText").value.trim(),
            }),
          });
          const data = await hotelAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || "Unable to send message");
          }
          document.getElementById("newMessageText").value = "";
          activeThreadId = data.thread_id;
          activeRecipientHotelId = recipientHotelId.value;
          activeRecipientHotelName = recipientHotelId.options[recipientHotelId.selectedIndex]?.textContent || "";
          await loadMessages(data.thread_id);
          hotelAdminCommon.setMessage(pageMessage, "Message sent successfully.", "success");
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(sendButton, false);
        }
      });

      replyButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(pageMessage);
        if (!activeRecipientHotelId) {
          hotelAdminCommon.setMessage(pageMessage, "Open a conversation first.", "error");
          return;
        }
        hotelAdminCommon.setButtonLoading(replyButton, true, "Sending...");
        try {
          const response = await fetch("/api/hotel-admin/messages", {
            method: "POST",
            headers: hotelAdminCommon.authHeaders(tokenInput),
            body: JSON.stringify({
              action: "send_message",
              hotel_id: hotelIdInput.value.trim(),
              recipient_hotel_id: activeRecipientHotelId,
              message_text: document.getElementById("replyMessageText").value.trim(),
            }),
          });
          const data = await hotelAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || "Unable to send reply");
          }
          document.getElementById("replyMessageText").value = "";
          await loadMessages(data.thread_id);
          hotelAdminCommon.setMessage(pageMessage, "Reply sent successfully.", "success");
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(replyButton, false);
        }
      });

      hotelSearch.addEventListener("input", applyHotelSearch);

      if (tokenInput.value.trim() && hotelIdInput.value.trim()) {
        loadInbox().catch(() => {});
      }
    </script>
  </body>
</html>
