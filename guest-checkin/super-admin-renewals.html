<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Renewal Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-common.js?v=20260718-1"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: {
                950: "#08131d",
                900: "#0f2436",
                800: "#17344d",
              },
              coral: "#d98d63",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminCommon.pageChrome("Renewal Queue", "Renewals", "Review hotel renewal requests, record subscription payments, and dismiss requests from a focused mobile page."));
      </script>
        <script>
          document.write(superAdminCommon.quickNav("renewals"));
        </script>
        <div class="p-5">
          <div class="space-y-4">
            <div>
              <label for="superAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Super Admin Token</label>
              <input id="superAdminToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Paste SUPER_ADMIN_TOKEN">
            </div>
            <button id="refreshButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">
              Refresh Renewal Queue
            </button>
          </div>

          <div class="mt-5 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Use this page only for renewal work: finish pending requests here, then use Reports separately for audit history.
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Pending</p>
              <p id="pendingRenewalsStat" class="mt-2 text-xl font-semibold text-coral">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Payments</p>
              <p id="recentPaymentsStat" class="mt-2 text-xl font-semibold text-ocean-950">0</p>
            </div>
          </div>

          <div id="renewalQueueState" class="mt-5 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load hotels to view pending renewal requests.</div>
          <div id="renewalQueueList" class="mt-4 grid gap-4"></div>

          <div class="mt-6">
            <h2 class="text-lg font-semibold text-ocean-950">Recent Subscription Payments</h2>
            <div id="recentPaymentsList" class="mt-4 grid gap-3"></div>
          </div>
        </div>
      </section>
    </main>

    <template id="renewalRequestTemplate">
      <article class="rounded-[1.75rem] border border-slate-200 bg-slate-50 p-5">
        <div class="flex flex-col gap-4">
          <div>
            <div class="flex flex-wrap items-center gap-2">
              <h3 data-field="hotelName" class="text-lg font-semibold text-ocean-950"></h3>
              <span data-field="requestStatus" class="rounded-full px-3 py-1 text-xs font-semibold"></span>
            </div>
            <p class="mt-2 text-sm text-slate-500">Hotel ID: <span data-field="hotelId" class="font-medium text-slate-700"></span></p>
            <p class="mt-1 text-sm text-slate-500">Current subscription end: <span data-field="currentEnd" class="font-medium text-slate-700"></span></p>
            <p class="mt-1 text-sm text-slate-500">Requested plan: <span data-field="requestedMonths" class="font-medium text-slate-700"></span></p>
            <p class="mt-1 text-sm text-slate-500">Projected end: <span data-field="requestedEnd" class="font-medium text-slate-700"></span></p>
            <p class="mt-1 text-sm text-slate-500">Request note: <span data-field="requestNote" class="font-medium text-slate-700"></span></p>
            <p class="mt-1 text-sm text-slate-500">Created: <span data-field="createdAt" class="font-medium text-slate-700"></span></p>
          </div>
          <form data-role="paymentForm" class="rounded-2xl border border-slate-200 bg-white p-4">
            <p class="text-sm font-semibold uppercase tracking-[0.2em] text-slate-500">Record Payment</p>
            <div class="mt-4 grid grid-cols-2 gap-3">
              <div>
                <label class="mb-2 block text-sm font-medium text-slate-700">Amount Paid</label>
                <input data-input="amountPaid" type="number" min="0" step="0.01" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
              </div>
              <div>
                <label class="mb-2 block text-sm font-medium text-slate-700">Plan Months</label>
                <input data-input="planMonths" type="number" min="1" max="24" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
              </div>
            </div>
            <div class="mt-3 grid grid-cols-2 gap-3">
              <div>
                <label class="mb-2 block text-sm font-medium text-slate-700">Method</label>
                <select data-input="paymentMethod" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
                  <option value="UPI">UPI</option>
                  <option value="Bank Transfer">Bank Transfer</option>
                  <option value="Cash">Cash</option>
                  <option value="Card">Card</option>
                </select>
              </div>
              <div>
                <label class="mb-2 block text-sm font-medium text-slate-700">Payment Date</label>
                <input data-input="paymentDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
              </div>
            </div>
            <div class="mt-3">
              <label class="mb-2 block text-sm font-medium text-slate-700">Reference</label>
              <input data-input="paymentReference" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="UTR, invoice, receipt no.">
            </div>
            <div class="mt-3">
              <label class="mb-2 block text-sm font-medium text-slate-700">Admin Note</label>
              <textarea data-input="paymentNote" rows="3" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Optional payment or renewal note"></textarea>
            </div>
            <div data-role="paymentMessage" class="mt-3 hidden rounded-2xl border px-4 py-3 text-sm"></div>
            <div class="mt-3 grid gap-3">
              <button type="submit" class="inline-flex items-center justify-center rounded-2xl bg-ocean-950 px-4 py-3 text-sm font-semibold text-white">Record Payment</button>
              <button type="button" data-action="dismissRequest" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm font-semibold text-slate-700">Dismiss</button>
            </div>
          </form>
        </div>
      </article>
    </template>

    <template id="recentPaymentTemplate">
      <article class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-4">
        <div>
          <p data-field="title" class="font-semibold text-ocean-950"></p>
          <p data-field="meta" class="mt-1 text-sm text-slate-600"></p>
          <p data-field="coverage" class="mt-2 text-sm text-slate-500"></p>
          <p data-field="reference" class="mt-1 text-sm text-slate-500"></p>
        </div>
      </article>
    </template>

    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const refreshButton = document.getElementById("refreshButton");
      const pendingRenewalsStat = document.getElementById("pendingRenewalsStat");
      const recentPaymentsStat = document.getElementById("recentPaymentsStat");
      const renewalQueueState = document.getElementById("renewalQueueState");
      const renewalQueueList = document.getElementById("renewalQueueList");
      const recentPaymentsList = document.getElementById("recentPaymentsList");
      const renewalRequestTemplate = document.getElementById("renewalRequestTemplate");
      const recentPaymentTemplate = document.getElementById("recentPaymentTemplate");

      superAdminCommon.restoreToken(tokenInput);

      function renderInlineMessage(element, message, tone) {
        superAdminCommon.setMessage(element, message, tone);
      }

      function renderRecentPayments(payments) {
        recentPaymentsList.innerHTML = "";
        recentPaymentsStat.textContent = String(payments.length);

        if (!payments.length) {
          const empty = document.createElement("div");
          empty.className = "rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600";
          empty.textContent = "No subscription payments recorded yet.";
          recentPaymentsList.appendChild(empty);
          return;
        }

        for (const payment of payments) {
          const fragment = recentPaymentTemplate.content.cloneNode(true);
          fragment.querySelector('[data-field="title"]').textContent = `${payment.hotel_name} • ${payment.currency_code} ${Number(payment.amount_paid || 0).toFixed(2)}`;
          fragment.querySelector('[data-field="meta"]').textContent = `${payment.plan_months} month plan via ${payment.payment_method} on ${payment.payment_date}`;
          fragment.querySelector('[data-field="coverage"]').textContent = `Coverage: ${payment.period_start_date} to ${payment.period_end_date}`;
          fragment.querySelector('[data-field="reference"]').textContent = `Reference: ${payment.payment_reference || "Not provided"}`;
          recentPaymentsList.appendChild(fragment);
        }
      }

      function renderRenewalRequestCard(request) {
        const fragment = renewalRequestTemplate.content.cloneNode(true);
        const statusBadge = fragment.querySelector('[data-field="requestStatus"]');
        const paymentForm = fragment.querySelector('[data-role="paymentForm"]');
        const paymentMessage = fragment.querySelector('[data-role="paymentMessage"]');
        const amountPaidInput = fragment.querySelector('[data-input="amountPaid"]');
        const planMonthsInput = fragment.querySelector('[data-input="planMonths"]');
        const paymentMethodInput = fragment.querySelector('[data-input="paymentMethod"]');
        const paymentDateInput = fragment.querySelector('[data-input="paymentDate"]');
        const paymentReferenceInput = fragment.querySelector('[data-input="paymentReference"]');
        const paymentNoteInput = fragment.querySelector('[data-input="paymentNote"]');

        fragment.querySelector('[data-field="hotelName"]').textContent = request.hotel_name;
        fragment.querySelector('[data-field="hotelId"]').textContent = request.hotel_id;
        fragment.querySelector('[data-field="currentEnd"]').textContent = request.subscription_end_date;
        fragment.querySelector('[data-field="requestedMonths"]').textContent = `${request.requested_months} month${request.requested_months === 1 ? "" : "s"}`;
        fragment.querySelector('[data-field="requestedEnd"]').textContent = request.requested_end_date || "Not set";
        fragment.querySelector('[data-field="requestNote"]').textContent = request.note || "No note added";
        fragment.querySelector('[data-field="createdAt"]').textContent = request.created_at;

        if (request.status === "pending") {
          statusBadge.textContent = "Pending";
          statusBadge.className = "rounded-full bg-amber-100 px-3 py-1 text-xs font-semibold text-amber-900";
        } else if (request.status === "completed") {
          statusBadge.textContent = "Completed";
          statusBadge.className = "rounded-full bg-emerald-100 px-3 py-1 text-xs font-semibold text-emerald-700";
        } else {
          statusBadge.textContent = "Dismissed";
          statusBadge.className = "rounded-full bg-slate-200 px-3 py-1 text-xs font-semibold text-slate-700";
        }

        amountPaidInput.value = "0";
        planMonthsInput.value = String(request.requested_months || 3);
        paymentDateInput.value = superAdminCommon.todayDate();

        paymentForm.addEventListener("submit", async (event) => {
          event.preventDefault();
          superAdminCommon.clearMessage(paymentMessage);
          try {
            const response = await fetch("/api/super-admin/subscriptions", {
              method: "POST",
              headers: superAdminCommon.authHeaders(tokenInput),
              body: JSON.stringify({
                action: "record_payment",
                hotel_id: request.hotel_id,
                request_id: request.id,
                amount_paid: Number(amountPaidInput.value || "0"),
                plan_months: Number(planMonthsInput.value || "0"),
                payment_method: paymentMethodInput.value,
                payment_reference: paymentReferenceInput.value.trim(),
                payment_date: paymentDateInput.value,
                note: paymentNoteInput.value.trim(),
              }),
            });
            const data = await superAdminCommon.readJson(response);
            if (!response.ok) {
              throw new Error(data.error || "Unable to record payment");
            }
            renderInlineMessage(paymentMessage, `${request.hotel_name} renewed until ${data.hotel.subscription_end_date}.`, "success");
            await loadRenewalQueue();
          } catch (error) {
            renderInlineMessage(paymentMessage, error instanceof Error ? error.message : "Unable to record payment", "error");
          }
        });

        fragment.querySelector('[data-action="dismissRequest"]').addEventListener("click", async () => {
          superAdminCommon.clearMessage(paymentMessage);
          try {
            const response = await fetch("/api/super-admin/subscriptions", {
              method: "POST",
              headers: superAdminCommon.authHeaders(tokenInput),
              body: JSON.stringify({
                action: "dismiss_request",
                request_id: request.id,
                resolved_note: "Dismissed from renewal queue",
              }),
            });
            const data = await superAdminCommon.readJson(response);
            if (!response.ok) {
              throw new Error(data.error || "Unable to dismiss request");
            }
            renderInlineMessage(paymentMessage, `Request for ${request.hotel_name} dismissed.`, "success");
            await loadRenewalQueue();
          } catch (error) {
            renderInlineMessage(paymentMessage, error instanceof Error ? error.message : "Unable to dismiss request", "error");
          }
        });

        return fragment;
      }

      function renderRenewalQueue(data) {
        const pendingRequests = (data.requests || []).filter((request) => request.status === "pending");
        renewalQueueList.innerHTML = "";
        pendingRenewalsStat.textContent = String(data.summary.pending_requests || 0);

        if (!pendingRequests.length) {
          renewalQueueState.textContent = "No pending renewal requests right now.";
        } else {
          renewalQueueState.textContent = `${pendingRequests.length} pending renewal request${pendingRequests.length === 1 ? "" : "s"} need attention.`;
          for (const request of pendingRequests) {
            renewalQueueList.appendChild(renderRenewalRequestCard(request));
          }
        }

        renderRecentPayments(data.payments || []);
      }

      async function loadRenewalQueue() {
        renewalQueueState.textContent = "Loading renewal queue...";
        renewalQueueList.innerHTML = "";
        recentPaymentsList.innerHTML = "";
        try {
          const response = await fetch("/api/super-admin/subscriptions", {
            headers: superAdminCommon.authHeaders(tokenInput),
          });
          const data = await superAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || "Unable to load renewal queue");
          }
          renderRenewalQueue(data);
        } catch (error) {
          pendingRenewalsStat.textContent = "0";
          recentPaymentsStat.textContent = "0";
          renewalQueueState.textContent = error instanceof Error ? error.message : "Unable to load renewal queue";
          recentPaymentsList.innerHTML = "";
        }
      }

      refreshButton.addEventListener("click", async () => {
        superAdminCommon.saveToken(tokenInput);
        superAdminCommon.setButtonLoading(refreshButton, true, "Refreshing...");
        try {
          await loadRenewalQueue();
        } finally {
          superAdminCommon.setButtonLoading(refreshButton, false);
        }
      });

      loadRenewalQueue().catch(() => {});
    </script>
  </body>
</html>
