<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super Admin Police Staff Register</title><script src="https://cdn.tailwindcss.com"></script><script src="super-admin-reports-common.js?v=20260719-1"></script></head><body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><script>document.write(superAdminReportsCommon.pageChrome("Staff Register","Staff","Review staff list and contact details for one hotel."));</script><div class="p-5"><div class="space-y-4"><input id="superAdminToken" type="password" class="hidden"><div><label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label><input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div><label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Filter Hotels</label><input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search hotel name or hotel ID"></div><div><label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label><select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><option value="">Load hotels</option></select></div><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="staffFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search staff, role, phone, email, or status"><div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th class="px-3 py-2 font-medium">Staff</th><th class="px-3 py-2 font-medium">Role</th><th class="px-3 py-2 font-medium">Phone</th><th class="px-3 py-2 font-medium">Email</th><th class="px-3 py-2 font-medium">Status</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=document.getElementById("superAdminToken"),viewerNameInput=document.getElementById("viewerName"),hotelFilterInput=document.getElementById("hotelFilter"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),staffFilter=document.getElementById("staffFilter"),statusBox=document.getElementById("statusBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let hotels=[],lastData=null;superAdminReportsCommon.hydrateFilters(tokenInput,viewerNameInput,fromDateInput,toDateInput);hotelIdInput.dataset.preselectedHotelId=new URLSearchParams(window.location.search).get("hotel_id")||localStorage.getItem("super_admin_police_hotel_id")||"";async function initHotels(){hotels=await superAdminReportsCommon.loadHotels();superAdminReportsCommon.renderHotelOptions(hotelIdInput,hotels);superAdminReportsCommon.attachHotelFilter(hotelFilterInput,hotelIdInput,hotels);}function filteredRows(rows){const q=superAdminReportsCommon.normalizeFilterValue(staffFilter.value);if(!q){return rows;}return rows.filter((staff)=>{const status=Number(staff.is_active)===1?"active":"inactive";return [staff.full_name,staff.role,staff.phone,staff.email,status].filter(Boolean).some((value)=>superAdminReportsCommon.normalizeFilterValue(value).includes(q));});}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} staff row${filtered.length===1?"":"s"} loaded.`;superAdminReportsCommon.renderTable(tableBox,filtered.map((staff)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean-950">${staff.full_name||"-"}</td><td class="px-3 py-3 text-slate-600">${staff.role||"-"}</td><td class="px-3 py-3 text-slate-600">${staff.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${staff.email||"-"}</td><td class="px-3 py-3 text-slate-600">${Number(staff.is_active)===1?"Active":"Inactive"}</td>`;return tr;}),5,"No staff register rows found.");}async function loadSection(){superAdminReportsCommon.clearMessage(statusBox);const data=await superAdminReportsCommon.loadHotelReport({tokenInput,viewerNameInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.staff_register||[]);}loadButton.addEventListener("click",async()=>{superAdminReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load report","error");}finally{superAdminReportsCommon.setButtonLoading(loadButton,false);}});exportButton.addEventListener("click",()=>{if(!lastData?.reports?.staff_register?.length){superAdminReportsCommon.setMessage(statusBox,"There is no data to export yet.","error");return;}const rows=[["Staff Name","Role","Phone","Email","Status","Working Since Month","Working Since Year"]];for(const staff of filteredRows(lastData.reports.staff_register)){rows.push([staff.full_name,staff.role,staff.phone,staff.email,Number(staff.is_active)===1?"Active":"Inactive",staff.working_since_month,staff.working_since_year]);}superAdminReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-staff-register.csv`,rows);});staffFilter.addEventListener("input",()=>{if(lastData?.reports?.staff_register){renderRows(lastData.reports.staff_register);}});initHotels().catch((error)=>superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load hotels","error"));</script></body></html>
