<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Today's Check-Outs</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js"></script><script src="hotel-reports-common.js"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script></head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Check-Outs</span></div><script>document.write(hotelReportsCommon.quickNav("checkouts"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 class="text-2xl font-semibold">Today's Check-Outs</h1><p class="mt-2 text-sm leading-6 text-white/80">Review guests checked out today.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelAdminToken" type="password" placeholder="Hotel Admin Token" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div id="listBox" class="mt-4 space-y-3"></div></div></section></main><script>const tokenInput=document.getElementById("hotelAdminToken"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),listBox=document.getElementById("listBox");hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});stateBox.textContent=`${data.reports.checkouts_today.length} check-out row${data.reports.checkouts_today.length===1?"":"s"} loaded.`;hotelReportsCommon.renderCards(listBox,data.reports.checkouts_today,"No guests checked out today.",(guest)=>`<h3 class="text-base font-semibold text-ocean">${guest.name}</h3>${hotelReportsCommon.createLine("Room",guest.room_number||"-")}${hotelReportsCommon.createLine("Phone",guest.phone||"-")}${hotelReportsCommon.createLine("Checked Out",guest.check_out_time||"-")}`);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:"Unable to load report","error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);}});</script></body></html>
