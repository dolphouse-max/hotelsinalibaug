<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f2436">
    <title>Hotel Message Monitor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-common.js"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ocean: "#08131d", harbor: "#17344d" } } } };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminCommon.pageChrome("Hotel Message Monitor", "Messages", "Review hotel-to-hotel conversations for room availability requests and overflow guest coordination."));
      </script>
      <script>
        document.write(superAdminCommon.quickNav("messages"));
      </script>

      <div class="p-5">
        <div class="space-y-4">
          <div>
            <label for="superAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Super Admin Token</label>
            <input id="superAdminToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
          </div>
          <div>
            <label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Search Hotel in Conversations</label>
            <input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Search hotel name or ID">
          </div>
          <button id="refreshButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">
            Refresh Conversations
          </button>
          <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
        </div>

        <div id="threadsState" class="mt-5 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load conversations to monitor hotel messages.</div>
        <div id="threadsList" class="mt-4 grid gap-3"></div>
      </div>
      </section>
    </main>

    <section class="mx-auto mb-10 max-w-md px-4">
      <div class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="flex items-center justify-between gap-3">
          <h2 class="text-lg font-semibold text-ocean">Selected Thread</h2>
          <span id="threadBadge" class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-500">No thread</span>
        </div>
        <div id="messagesState" class="mt-4 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Select a thread to inspect messages.</div>
        <div id="messagesList" class="mt-4 grid gap-3"></div>
      </div>
    </section>

    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const hotelFilter = document.getElementById("hotelFilter");
      const refreshButton = document.getElementById("refreshButton");
      const pageMessage = document.getElementById("pageMessage");
      const threadsState = document.getElementById("threadsState");
      const threadsList = document.getElementById("threadsList");
      const messagesState = document.getElementById("messagesState");
      const messagesList = document.getElementById("messagesList");
      const threadBadge = document.getElementById("threadBadge");

      let allThreads = [];

      superAdminCommon.restoreToken(tokenInput);

      function renderThreads() {
        const query = hotelFilter.value.trim().toLowerCase();
        const threads = !query
          ? allThreads
          : allThreads.filter((thread) =>
              [thread.hotel_a_id, thread.hotel_a_name, thread.hotel_b_id, thread.hotel_b_name]
                .filter(Boolean)
                .some((value) => String(value).toLowerCase().includes(query))
            );

        threadsList.innerHTML = "";
        if (!threads.length) {
          threadsState.textContent = allThreads.length ? "No conversations match this search." : "No hotel conversations yet.";
          return;
        }

        threadsState.textContent = `${threads.length} conversation${threads.length === 1 ? "" : "s"} shown.`;
        for (const thread of threads) {
          const card = document.createElement("button");
          card.type = "button";
          card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-4 text-left";
          card.innerHTML = `
            <p class="font-semibold text-slate-900">${thread.hotel_a_name} <span class="text-slate-400">↔</span> ${thread.hotel_b_name}</p>
            <p class="mt-1 text-xs uppercase tracking-[0.16em] text-slate-500">${thread.hotel_a_id} • ${thread.hotel_b_id}</p>
            <p class="mt-3 text-sm leading-6 text-slate-600">${thread.latest_message_text || "No messages yet"}</p>
            <p class="mt-2 text-xs text-slate-500">Last update: ${thread.latest_message_created_at || thread.last_message_at}</p>
          `;
          card.addEventListener("click", async () => {
            threadBadge.textContent = `${thread.hotel_a_name} ↔ ${thread.hotel_b_name}`;
            await loadMessages(thread.id);
          });
          threadsList.appendChild(card);
        }
      }

      function renderMessages(messages) {
        messagesList.innerHTML = "";
        if (!messages.length) {
          messagesState.textContent = "No messages in this thread yet.";
          return;
        }

        messagesState.textContent = `${messages.length} message${messages.length === 1 ? "" : "s"} loaded.`;
        for (const message of messages) {
          const card = document.createElement("article");
          card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm";
          card.innerHTML = `
            <p class="font-semibold text-slate-900">${message.sender_hotel_name}</p>
            <p class="mt-2 leading-6 text-slate-700">${message.message_text}</p>
            <p class="mt-2 text-xs text-slate-500">${message.created_at}</p>
          `;
          messagesList.appendChild(card);
        }
      }

      async function loadThreads() {
        const url = new URL("/api/super-admin/messages", window.location.origin);
        if (hotelFilter.value.trim()) {
          url.searchParams.set("hotel_q", hotelFilter.value.trim());
        }
        const response = await fetch(url.toString(), {
          headers: superAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await superAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || "Unable to load hotel messages");
        }
        allThreads = data.threads || [];
        renderThreads();
      }

      async function loadMessages(threadId) {
        const url = new URL("/api/super-admin/messages", window.location.origin);
        url.searchParams.set("thread_id", threadId);
        const response = await fetch(url.toString(), {
          headers: superAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await superAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || "Unable to load thread messages");
        }
        renderMessages(data.messages || []);
      }

      refreshButton.addEventListener("click", async () => {
        superAdminCommon.clearMessage(pageMessage);
        superAdminCommon.setButtonLoading(refreshButton, true, "Refreshing...");
        try {
          await loadThreads();
        } catch (error) {
          superAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          superAdminCommon.setButtonLoading(refreshButton, false);
        }
      });

      hotelFilter.addEventListener("input", renderThreads);

      if (tokenInput.value.trim()) {
        loadThreads().catch(() => {});
      }
    </script>
  </body>
</html>
