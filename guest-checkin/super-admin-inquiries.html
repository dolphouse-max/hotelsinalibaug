<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0f2436">
    <title>Website Inquiries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-common.js?v=20260723-1"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { ocean: "#08131d", harbor: "#17344d" } } } };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminCommon.pageChrome("Website Inquiries", "Inquiries", "Review leads from all hotel webpages in one place so you can monitor demand and follow up quickly."));
      </script>
      <script>
        document.write(superAdminCommon.quickNav("inquiries"));
      </script>

      <div class="p-5 space-y-4">
        <div>
          <label for="superAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Super Admin Token</label>
          <input id="superAdminToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10">
        </div>
        <div>
          <label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Search Hotel Name or Hotel ID</label>
          <input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Search hotel">
        </div>
        <div>
          <label for="searchInput" class="mb-2 block text-sm font-medium text-slate-700">Search Guest Name, Mobile, or Inquiry</label>
          <input id="searchInput" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-ocean-900 focus:ring-4 focus:ring-ocean-900/10" placeholder="Search guest inquiry">
        </div>
        <button id="refreshButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">
          Refresh Inquiries
        </button>
        <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
      </div>
      </section>
    </main>

    <section class="mx-auto mb-10 max-w-md px-4">
      <div class="rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div id="inquiriesState" class="rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load inquiries to monitor hotel webpage leads.</div>
        <div id="inquiriesList" class="mt-4 grid gap-3"></div>
      </div>
    </section>

    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const hotelFilter = document.getElementById("hotelFilter");
      const searchInput = document.getElementById("searchInput");
      const refreshButton = document.getElementById("refreshButton");
      const pageMessage = document.getElementById("pageMessage");
      const inquiriesState = document.getElementById("inquiriesState");
      const inquiriesList = document.getElementById("inquiriesList");
      let allInquiries = [];

      superAdminCommon.restoreToken(tokenInput);

      function renderInquiries() {
        const hotelQuery = hotelFilter.value.trim().toLowerCase();
        const query = searchInput.value.trim().toLowerCase();
        const filtered = allInquiries.filter((item) => {
          const hotelMatch = !hotelQuery || [item.hotel_name, item.hotel_id, item.hotel_name_snapshot]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(hotelQuery));
          const guestMatch = !query || [item.guest_name, item.guest_phone, item.guest_message, item.page_title_snapshot]
            .filter(Boolean)
            .some((value) => String(value).toLowerCase().includes(query));
          return hotelMatch && guestMatch;
        });

        inquiriesList.innerHTML = "";
        if (!filtered.length) {
          inquiriesState.textContent = allInquiries.length ? "No inquiries match these filters." : "No website inquiries yet.";
          return;
        }

        inquiriesState.textContent = `${filtered.length} inquir${filtered.length === 1 ? "y" : "ies"} shown.`;
        for (const inquiry of filtered) {
          const card = document.createElement("article");
          card.className = "rounded-2xl border border-slate-200 bg-slate-50 p-4";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="font-semibold text-slate-900">${inquiry.guest_name}</p>
                <p class="mt-1 text-xs uppercase tracking-[0.16em] text-slate-500">${inquiry.guest_phone}</p>
              </div>
              <a href="tel:${inquiry.guest_phone}" class="rounded-2xl bg-ocean-950 px-4 py-2 text-sm font-semibold text-white">Call Guest</a>
            </div>
            <div class="mt-3 grid grid-cols-2 gap-2 text-xs text-slate-500">
              <p><strong>Check-in:</strong> ${inquiry.check_in_date || "-"}</p>
              <p><strong>Check-out:</strong> ${inquiry.check_out_date || "-"}</p>
              <p><strong>Persons:</strong> ${inquiry.total_persons || "-"}</p>
              <p><strong>Room Type:</strong> ${inquiry.requested_room_type || "-"}</p>
            </div>
            <p class="mt-3 text-sm text-slate-700">${inquiry.guest_message}</p>
            <p class="mt-3 text-xs text-slate-500">Hotel: ${inquiry.hotel_name || inquiry.hotel_name_snapshot || inquiry.hotel_id} • Page: ${inquiry.page_title_snapshot || inquiry.public_page_slug || "-"} • ${inquiry.created_at}</p>
          `;
          inquiriesList.appendChild(card);
        }
      }

      async function loadInquiries() {
        const url = new URL("/api/super-admin/inquiries", window.location.origin);
        if (hotelFilter.value.trim()) {
          url.searchParams.set("hotel_q", hotelFilter.value.trim());
        }
        if (searchInput.value.trim()) {
          url.searchParams.set("q", searchInput.value.trim());
        }

        const response = await fetch(url.toString(), {
          headers: superAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await superAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || "Unable to load inquiries.");
        }
        allInquiries = data.inquiries || [];
        renderInquiries();
      }

      refreshButton.addEventListener("click", async () => {
        superAdminCommon.clearMessage(pageMessage);
        superAdminCommon.setButtonLoading(refreshButton, true, "Refreshing...");
        try {
          await loadInquiries();
        } catch (error) {
          superAdminCommon.setMessage(pageMessage, error.message || "Unable to load inquiries.", "error");
        } finally {
          superAdminCommon.setButtonLoading(refreshButton, false);
        }
      });

      hotelFilter.addEventListener("input", renderInquiries);
      searchInput.addEventListener("input", renderInquiries);
    </script>
  </body>
</html>
