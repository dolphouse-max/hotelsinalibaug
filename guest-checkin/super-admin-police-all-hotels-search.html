<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Super Admin All Hotels Guest Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="super-admin-reports-common.js?v=20260723-1"></script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(superAdminReportsCommon.pageChrome("All Hotels Guest Search", "Search", "Search guests across all hotels by mobile number, guest name, or car number."));
      </script>
      <div class="p-5">
        <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">This search uses your superadmin access and the saved report date range.</div>
        <div class="space-y-4">
          <input id="superAdminToken" type="password" class="hidden">
          <div><label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label><input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div>
          <div><label for="searchInput" class="mb-2 block text-sm font-medium text-slate-700">Search Guest</label><input id="searchInput" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Name, mobile number, or car number"></div>
          <div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div>
          <div class="flex flex-wrap gap-2">
            <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700" data-range="today">Today</button>
            <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700" data-range="7days">Last 7 Days</button>
            <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700" data-range="30days">Last 30 Days</button>
          </div>
          <button id="searchButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Search All Hotels</button>
          <div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
        </div>
        <section class="mt-5 rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4">
          <p id="resultsMeta" class="text-sm text-slate-500">Enter at least 2 characters to search.</p>
          <div id="resultsList" class="mt-4 space-y-3"></div>
        </section>
      </div>
    </section>
    </main>
    <script>
      const tokenInput = document.getElementById("superAdminToken");
      const viewerNameInput = document.getElementById("viewerName");
      const searchInput = document.getElementById("searchInput");
      const fromDateInput = document.getElementById("fromDate");
      const toDateInput = document.getElementById("toDate");
      const searchButton = document.getElementById("searchButton");
      const statusBox = document.getElementById("statusBox");
      const resultsMeta = document.getElementById("resultsMeta");
      const resultsList = document.getElementById("resultsList");
      const dateChips = Array.from(document.querySelectorAll(".date-chip"));
      superAdminReportsCommon.hydrateFilters(tokenInput, viewerNameInput, fromDateInput, toDateInput);
      function esc(v){return String(v||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\"/g,"&quot;").replace(/'/g,"&#39;");}
      function setDateRange(daysBack){fromDateInput.value=superAdminReportsCommon.formatDateOffset(daysBack);toDateInput.value=superAdminReportsCommon.formatDateOffset(0);}
      function renderResults(rows){
        resultsList.innerHTML="";
        if(!rows.length){resultsList.innerHTML='<div class="rounded-[1.25rem] border border-slate-200 bg-white px-4 py-4 text-sm text-slate-500">No guest records matched this search.</div>';return;}
        for(const guest of rows){
          const card=document.createElement("article");
          card.className="rounded-[1.5rem] border border-slate-200 bg-white p-4";
          card.innerHTML=`<div class="flex items-start justify-between gap-3"><div><p class="text-base font-semibold text-ocean-950">${esc(guest.name||"Guest")}</p><p class="mt-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">${esc(guest.hotel_name||guest.hotel_id||"Hotel")}</p></div><div class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">${esc(guest.hotel_id||"-")}</div></div>${superAdminReportsCommon.createLine("Mobile",guest.phone||"-")}${superAdminReportsCommon.createLine("Car Number",guest.vehicle_number||"-")}${superAdminReportsCommon.createLine("Room Number",guest.room_number||"-")}${superAdminReportsCommon.createLine("ID Proof",[guest.id_type,guest.id_number].filter(Boolean).join(" - ")||"-")}${superAdminReportsCommon.createLine("Check In",guest.check_in_time||"-")}${superAdminReportsCommon.createLine("Check Out",guest.check_out_time||"Currently in house")}${superAdminReportsCommon.proofButtons(guest)}`;
          resultsList.appendChild(card);
        }
        superAdminReportsCommon.attachProofButtons(resultsList, tokenInput, viewerNameInput, statusBox);
      }
      async function searchGuests(){
        const query=searchInput.value.trim();
        if(query.length<2){superAdminReportsCommon.setMessage(statusBox,"Please enter at least 2 characters to search.","error");return;}
        superAdminReportsCommon.persistFilters(tokenInput, viewerNameInput, fromDateInput, toDateInput);
        const url=new URL("/api/super-admin/guest-search",window.location.origin);
        url.searchParams.set("q",query);url.searchParams.set("from",fromDateInput.value);url.searchParams.set("to",toDateInput.value);
        try{
          superAdminReportsCommon.clearMessage(statusBox);
          superAdminReportsCommon.setButtonLoading(searchButton,true,"Searching...");
          const response=await fetch(url.toString());
          const data=await superAdminReportsCommon.readJson(response);
          if(!response.ok){throw new Error(data.error||"Unable to search guests");}
          resultsMeta.textContent=`${data.count||0} result(s) found for "${query}" from ${data.filters?.from||fromDateInput.value} to ${data.filters?.to||toDateInput.value}.`;
          renderResults(data.guests||[]);
        }catch(error){
          resultsMeta.textContent="Unable to load results.";
          renderResults([]);
          superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to search guests","error");
        }finally{
          superAdminReportsCommon.setButtonLoading(searchButton,false,"Searching...");
        }
      }
      for(const chip of dateChips){chip.addEventListener("click",()=>{const range=chip.dataset.range||"";if(range==="today"){setDateRange(0);}else if(range==="7days"){setDateRange(6);}else if(range==="30days"){setDateRange(29);}});}
      searchButton.addEventListener("click",searchGuests);
      searchInput.addEventListener("keydown",(event)=>{if(event.key==="Enter"){event.preventDefault();searchGuests();}});
    </script>
  </body>
</html>
