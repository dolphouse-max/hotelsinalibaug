<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CHECKIN | Alibaug Hotels</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>:root{--blue:#075dc8;--navy:#061a3d;--gold:#ffd12e}*{box-sizing:border-box}body{margin:0;background:#020d24;font-family:Outfit,'Noto Sans Devanagari',sans-serif}.slide{display:none;position:relative;isolation:isolate;min-height:100svh;overflow:hidden;color:#082f68;background:linear-gradient(145deg,#fff,#e5f3ff);place-items:center}.slide.on{display:grid}.bg,.shade{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-2}.shade{z-index:-1;background:linear-gradient(180deg,#ffffffed,#ffffffb8 58%,#ffffff20)}.content{width:min(880px,82vw);padding:5rem 0}.num{position:absolute;top:1.5rem;left:1.5rem;padding:.45rem .7rem;color:white;background:var(--blue);font-weight:800}.eyebrow{margin:0 0 .65rem;color:var(--blue);font-size:clamp(.92rem,2vw,1.35rem);font-weight:800;letter-spacing:.05em}.title{margin:0;font-family:'Noto Sans Devanagari',Outfit,sans-serif;font-size:clamp(2.5rem,7vw,5.4rem);line-height:1.16;letter-spacing:-.045em}.copy{margin:1.3rem 0 0;white-space:pre-line;font-family:'Noto Sans Devanagari';font-size:clamp(1.12rem,2.35vw,1.8rem);line-height:1.68;font-weight:600}.dark{color:#fff;background:#061a3d}.dark .shade{background:linear-gradient(180deg,#061a3de8,#061a3da6,#061a3d22)}.dark .eyebrow{color:#fff}.dark .title strong{color:var(--gold)}.dark .copy{max-width:700px}.cover .title{font-family:Outfit;font-size:clamp(4rem,11vw,8.8rem);letter-spacing:.04em}.cover .sub{margin-top:.4rem;color:var(--gold);font-family:'Noto Sans Devanagari';font-size:clamp(1.2rem,2.8vw,2.2rem);font-weight:800}.quote{margin-top:2rem;padding:1.2rem 1.35rem;border-left:6px solid var(--gold);background:#ffffff18;border-radius:0 16px 16px 0;font-family:'Noto Sans Devanagari';font-size:clamp(1.15rem,2.4vw,1.85rem);line-height:1.55;font-weight:700}.feature{display:grid;grid-template-columns:auto 1fr;gap:1rem;align-items:start;margin:1.1rem 0;padding:1rem 1.2rem;background:#ffffffc8;border:1px solid #a9c9ee;border-radius:16px;font-family:'Noto Sans Devanagari';font-size:clamp(1rem,1.8vw,1.45rem);line-height:1.5;font-weight:600}.feature b{display:grid;place-items:center;width:2.5rem;height:2.5rem;color:white;background:var(--blue);border-radius:50%;font-family:Outfit}.price{display:flex;gap:1rem;align-items:stretch;margin-top:1.7rem}.price div{flex:1;padding:1rem;color:white;background:linear-gradient(135deg,#4d9d58,#1c7335);border-radius:16px;text-align:center}.price div:last-child{background:linear-gradient(135deg,#2374d1,#07529b)}.price b{display:block;font-size:clamp(2.8rem,6vw,5rem);line-height:1}.price span{font-family:'Noto Sans Devanagari';font-weight:700}.promise{font-family:'Noto Sans Devanagari';font-size:clamp(1.25rem,2.7vw,2rem);font-weight:800;line-height:1.55;color:#1f612b}.signature{margin-top:2rem;font-family:'Noto Sans Devanagari';font-size:clamp(1rem,1.9vw,1.4rem);line-height:1.6;font-weight:700}.controls{position:fixed;right:1.2rem;bottom:1.2rem;z-index:4;display:flex;align-items:center;gap:.7rem;padding:.5rem;color:#fff;background:#061a3ee3;border:1px solid #ffffff45;border-radius:99px;backdrop-filter:blur(8px)}button{width:2.45rem;height:2.45rem;border:0;border-radius:50%;background:#fff;color:#08356f;font-size:1.2rem;cursor:pointer}.progress{position:fixed;z-index:4;left:50%;bottom:1.8rem;display:flex;gap:.4rem;transform:translateX(-50%)}.dot{width:8px;height:8px;padding:0;background:#fff8}.dot.on{width:24px;border-radius:8px;background:#fff}@media(max-width:650px){.content{width:calc(100vw - 3rem);padding:4.6rem 0 6rem}.feature{gap:.7rem;margin:.75rem 0;padding:.8rem;font-size:.94rem}.feature b{width:2rem;height:2rem}.price{gap:.55rem}.price div{padding:.8rem .45rem}.price span{font-size:.74rem}.progress{display:none}}</style>    <link rel="stylesheet" href="/three-d-surfaces.css">
  </head><body><main id="deck"></main><div class="progress" id="progress"></div><div class="controls"><button id="prev" aria-label="Previous">←</button><span><b id="count">1</b> / 10</span><button id="next" aria-label="Next">→</button></div><script>const S=(type,eyebrow,title,body='',extra='',img='')=>`<article class="slide ${type}">${img?`<img class="bg" src="${img}" alt="">`:''}<div class="shade"></div><b class="num"></b><section class="content"><p class="eyebrow">${eyebrow}</p><h1 class="title">${title}</h1>${body?`<p class="copy">${body}</p>`:''}${extra}</section></article>`;const F=(icon,text)=>`<div class="feature"><b>${icon}</b><span>${text}</span></div>`;const slides=[S('cover dark','हॉटेल मालक मित्रांसाठी','CHECKIN','आपण पाहुण्यांची उत्तम सेवा करता.\nव्यवस्थापनाची काळजी CHECKIN घेईल.','<p class="sub">आधुनिक • स्मार्ट • सुरक्षित</p>','home-screen.webp'),S('dark','नमस्कार हॉटेल मालक मित्रांनो','आपला वेळ\nखरोखर महत्त्वाचा आहे.','रिसेप्शनवरील रजिस्टर, आरक्षण, कागदपत्रे आणि फोन यामध्ये बराच वेळ जातो.','<div class="quote">पाहुण्यांची सेवा उत्तम ठेवताना व्यवस्थापन सोपे करता येईल का?</div>','home-screen.webp'),S('plain','आपल्यासाठी विकसित','CHECKIN म्हणजे काय?','अलिबागमधील हॉटेल्ससाठी विकसित केलेले एक आधुनिक, High-Tech Hotel Operating System.'),S('plain','एक सोपा अनुभव','पाहुणे स्वतः\nCheck-In करतील.', '',F('QR','QR Code स्कॅन करून पाहुणे मोबाइलवर चेक-इन माहिती भरतात.')+F('↻','सुरक्षेसाठी QR Code ठराविक वेळेनंतर आपोआप बदलतो.')),S('plain','एका नजरेत नियोजन','Booking Calendar','भविष्यातील सर्व बुकिंग्स सुंदर Calendar View मध्ये दिसतात. त्यामुळे नियोजन सोपे आणि चुका कमी.'),S('plain','एकत्र मदत','One-Click\nOverbooking Alert','एका क्लिकमध्ये सहभागी हॉटेल्सना माहिती पाठवा. पाहुण्यासाठी पर्यायी व्यवस्था शोधणे सोपे होते.'),S('plain','आपली ऑनलाइन ओळख','Free Hotel Webpage','प्रत्येक सहभागी हॉटेलला HotelsInAlibaug.com वर मोफत स्वतंत्र वेबपेज उपलब्ध करून दिले जाईल.'),S('dark','माझा विचार','विश्वासार्ह प्रणाली\nमोठी व्यवस्था चालवते.','मी 30 वर्षे परदेशी शिपिंग कंपन्यांमध्ये Chief Engineer म्हणून काम केले आहे. त्या अनुभवातून CHECKIN विकसित केले आहे.','<div class="quote">हे पैसे कमवण्यासाठी नाही, तर आपल्या हॉटेल व्यवसायाला अधिक आधुनिक, सुरक्षित आणि सोपे करण्यासाठी आहे.</div>','home-screen.webp'),S('plain','लॉन्च ऑफर','31 ऑक्टोबर 2026 पर्यंत\nपूर्णपणे मोफत!','आत्ताच वापरून पहा. कोणतेही बंधन नाही.','<div class="price"><div><b>₹10</b><span>प्रति खोली प्रति महिना</span></div><div><b>₹100</b><span>प्रति खोली प्रति वर्ष</span></div></div>'),S('dark','एकच विनंती','आधी वापरून पहा.','कृपया 31 ऑक्टोबर 2026 पर्यंत हे ॲप पूर्णपणे मोफत वापरून पाहा. आवडलं, उपयोगी वाटलं तरच पुढे सदस्यत्व घ्या.','<p class="promise">तुम्ही पाहुण्यांची काळजी घ्या…<br>व्यवस्थापनाची काळजी CHECKIN घेईल. ❤️</p><p class="signature">– गिरीश जगन्नाथ पाटील<br>Hotels In Alibaug</p>','home-screen.webp')];deck.innerHTML=slides.join('');const all=[...document.querySelectorAll('.slide')];all.forEach((x,i)=>x.querySelector('.num').textContent=String(i+1).padStart(2,'0'));progress.innerHTML=all.map((_,i)=>`<button class="dot" data-dot="${i}" aria-label="Slide ${i+1}"></button>`).join('');let n=0;function go(i){n=(i+all.length)%all.length;all.forEach((x,j)=>x.classList.toggle('on',n===j));document.querySelectorAll('.dot').forEach((x,j)=>x.classList.toggle('on',n===j));count.textContent=n+1;history.replaceState(null,'',`#slide-${n+1}`)}prev.onclick=()=>go(n-1);next.onclick=()=>go(n+1);progress.onclick=e=>e.target.dataset.dot&&go(+e.target.dataset.dot);onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' ')go(n+1);if(e.key==='ArrowLeft')go(n-1)};go(location.hash?+location.hash.replace('#slide-','')-1:0)</script></body></html>
