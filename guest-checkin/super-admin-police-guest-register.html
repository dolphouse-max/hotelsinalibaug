<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super Admin Police Guest Register</title><script src="https://cdn.tailwindcss.com"></script><script src="super-admin-reports-common.js?v=20260723-1"></script>    <link rel="stylesheet" href="/three-d-surfaces.css">
  </head><body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><script>document.write(superAdminReportsCommon.pageChrome("Guest Register","Register","Search the guest register for one hotel using police-style filters."));</script><div class="p-5"><div class="space-y-4"><input id="superAdminToken" type="password" class="hidden"><div><label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label><input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div><label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Filter Hotels</label><input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search hotel name or hotel ID"></div><div><label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label><select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><option value="">Load hotels</option></select></div><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="guestFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search guest, mobile, room, ID, or car number"><div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th class="px-3 py-2 font-medium">Guest</th><th class="px-3 py-2 font-medium">Room</th><th class="px-3 py-2 font-medium">Phone</th><th class="px-3 py-2 font-medium">ID</th><th class="px-3 py-2 font-medium">Car</th><th class="px-3 py-2 font-medium">Check-In</th><th class="px-3 py-2 font-medium">Check-Out</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=document.getElementById("superAdminToken"),viewerNameInput=document.getElementById("viewerName"),hotelFilterInput=document.getElementById("hotelFilter"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),guestFilter=document.getElementById("guestFilter"),statusBox=document.getElementById("statusBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let hotels=[],lastData=null;superAdminReportsCommon.hydrateFilters(tokenInput,viewerNameInput,fromDateInput,toDateInput);hotelIdInput.dataset.preselectedHotelId=new URLSearchParams(window.location.search).get("hotel_id")||localStorage.getItem("super_admin_police_hotel_id")||"";async function initHotels(){hotels=await superAdminReportsCommon.loadHotels();superAdminReportsCommon.renderHotelOptions(hotelIdInput,hotels);superAdminReportsCommon.attachHotelFilter(hotelFilterInput,hotelIdInput,hotels);}function filteredRows(rows){const q=superAdminReportsCommon.normalizeFilterValue(guestFilter.value);if(!q){return rows;}return rows.filter((guest)=>[guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number,guest.vehicle_number].filter(Boolean).some((value)=>superAdminReportsCommon.normalizeFilterValue(value).includes(q)));}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} guest register row${filtered.length===1?"":"s"} loaded.`;superAdminReportsCommon.renderTable(tableBox,filtered.map((guest)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean-950">${guest.name}</td><td class="px-3 py-3 text-slate-600">${guest.room_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.id_type||"-"} / ${guest.id_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.vehicle_number||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_in_time||"-"}</td><td class="px-3 py-3 text-slate-600">${guest.check_out_time||"-"}</td>`;return tr;}),7,"No guest register rows found.");}async function loadSection(){superAdminReportsCommon.clearMessage(statusBox);const data=await superAdminReportsCommon.loadHotelReport({tokenInput,viewerNameInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.guest_register||[]);}loadButton.addEventListener("click",async()=>{superAdminReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load report","error");}finally{superAdminReportsCommon.setButtonLoading(loadButton,false);}});exportButton.addEventListener("click",()=>{if(!lastData?.reports?.guest_register?.length){superAdminReportsCommon.setMessage(statusBox,"There is no data to export yet.","error");return;}const rows=[["Guest Name","Room Number","Phone","ID Type","ID Number","Car Number","Check In","Check Out"]];for(const guest of filteredRows(lastData.reports.guest_register)){rows.push([guest.name,guest.room_number,guest.phone,guest.id_type,guest.id_number,guest.vehicle_number,guest.check_in_time,guest.check_out_time]);}superAdminReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-guest-register.csv`,rows);});guestFilter.addEventListener("input",()=>{if(lastData?.reports?.guest_register){renderRows(lastData.reports.guest_register);}});initHotels().catch((error)=>superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load hotels","error"));</script></body></html>
