<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#17324a">
    <title>Notifications | Hotel Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="hotel-admin-common.js?v=20260725-2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: "#0b1824",
              harbor: "#17324a",
              shell: "#f6efe3",
            },
          },
        },
      };
    </script>
      <link rel="stylesheet" href="/three-d-surfaces.css">
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div class="flex items-center justify-between text-sm">
        <a id="notificationsBackLink" href="/hotel-admin-home.html" class="font-medium text-slate-600">Back to Home</a>
        <span id="notificationsBadge" class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Alerts</span>
      </div>
      <script>
        document.write(hotelAdminCommon.quickNav("notifications"));
      </script>

      <section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white">
          <h1 id="notificationsHeroTitle" class="text-2xl font-semibold">Notification Centre</h1>
          <p id="notificationsHeroBody" class="mt-2 text-sm leading-6 text-white/80">Read greetings and subscription reminders. Enable browser alerts on this device to get on-screen notices while the PWA is open.</p>
        </div>

        <div class="p-5">
          <div class="grid gap-4">
            <div>
              <label id="notificationsTokenLabel" for="hotelAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Hotel Admin Token</label>
              <input id="hotelAdminToken" type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
            </div>
            <div>
              <label id="notificationsHotelIdLabel" for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel ID</label>
              <input id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button id="enableNotificationsButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-4 py-3 font-semibold text-slate-700">
                Enable Alerts
              </button>
              <button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean px-4 py-3 font-semibold text-white">
                Load Alerts
              </button>
            </div>
            <div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>

          <div class="mt-5 grid grid-cols-2 gap-3">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p id="permissionLabel" class="text-sm text-slate-500">Permission</p>
              <p id="permissionState" class="mt-1 font-semibold text-slate-900">Unknown</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p id="unseenLabel" class="text-sm text-slate-500">Unseen Alerts</p>
              <p id="unseenCount" class="mt-1 font-semibold text-slate-900">0</p>
            </div>
          </div>
        </div>
      </section>

      <section class="mt-5 rounded-[2rem] border border-slate-200 bg-white p-5 shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="flex items-center justify-between">
          <h2 id="latestAlertsTitle" class="text-lg font-semibold text-ocean">Latest Alerts</h2>
          <button id="markAllSeenButton" type="button" class="rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm font-medium text-slate-700">
            Mark All Seen
          </button>
        </div>
        <div id="notificationsList" class="mt-4 space-y-3"></div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("hotelAdminToken");
      const hotelIdInput = document.getElementById("hotelId");
      const statusBox = document.getElementById("statusBox");
      const loadButton = document.getElementById("loadButton");
      const enableNotificationsButton = document.getElementById("enableNotificationsButton");
      const markAllSeenButton = document.getElementById("markAllSeenButton");
      const notificationsList = document.getElementById("notificationsList");
      const unseenCount = document.getElementById("unseenCount");
      const permissionState = document.getElementById("permissionState");
      let activePushSubscription = null;
      const notificationsTranslations = {
        en: {
          title: "Notifications | Hotel Admin",
          back: "Back to Home",
          badge: "Alerts",
          heroTitle: "Notification Centre",
          heroBody: "Read greetings and subscription reminders. Enable browser alerts on this device to get on-screen notices while the PWA is open.",
          tokenLabel: "Hotel Admin Token",
          hotelIdLabel: "Hotel ID",
          enableButton: "Enable Alerts",
          loadButton: "Load Alerts",
          permissionLabel: "Permission",
          permissionUnknown: "Unknown",
          permissionUnsupported: "Not supported",
          unseenLabel: "Unseen Alerts",
          latestTitle: "Latest Alerts",
          markAll: "Mark All Seen",
          empty: "No alerts available right now.",
          seen: "Seen",
          new: "New",
          from: "From",
          sent: "Sent",
          openPage: "Open Page",
          markSeen: "Mark Seen",
          noBrowserSupport: "This device does not support browser notifications.",
          permissionDenied: "Notification permission was not granted.",
          enabled: "Background push alerts enabled on this device.",
          enableError: "Unable to enable push alerts.",
          loadError: "Unable to load alerts",
          loading: "Loading...",
          saving: "Saving...",
          noNewAlerts: "There are no new alerts to mark as seen.",
          updateError: "Unable to update alerts",
          allSeen: "All current alerts marked as seen.",
          pushUnsupported: "This device does not support background push notifications.",
          pushConfigError: "Unable to load push configuration",
          pushSaveError: "Unable to save device push subscription",
        },
        mr: {
          title: "सूचना | हॉटेल अॅडमिन",
          back: "मुख्यपृष्ठावर परत",
          badge: "सूचना",
          heroTitle: "सूचना केंद्र",
          heroBody: "शुभेच्छा संदेश आणि सदस्यता स्मरणपत्रे येथे वाचा. या उपकरणावर स्क्रीनवरील सूचना मिळण्यासाठी ब्राउझर सूचना सुरू करा, जेव्हा पीडब्ल्यूए उघडे असेल.",
          tokenLabel: "हॉटेल अॅडमिन टोकन",
          hotelIdLabel: "हॉटेल आयडी",
          enableButton: "सूचना सुरू करा",
          loadButton: "सूचना लोड करा",
          permissionLabel: "परवानगी",
          permissionUnknown: "अज्ञात",
          permissionUnsupported: "समर्थन नाही",
          unseenLabel: "न पाहिलेल्या सूचना",
          latestTitle: "नवीनतम सूचना",
          markAll: "सर्व पाहिले म्हणून चिन्हांकित करा",
          empty: "सध्या कोणतीही सूचना उपलब्ध नाही.",
          seen: "पाहिले",
          new: "नवीन",
          from: "कडून",
          sent: "पाठवले",
          openPage: "पान उघडा",
          markSeen: "पाहिले म्हणून चिन्हांकित करा",
          noBrowserSupport: "या उपकरणावर ब्राउझर सूचना उपलब्ध नाहीत.",
          permissionDenied: "सूचनेची परवानगी मंजूर झाली नाही.",
          enabled: "या उपकरणावर पार्श्वभूमीतील सूचना यशस्वीरीत्या सुरू झाल्या.",
          enableError: "सूचना सुरू करता आल्या नाहीत.",
          loadError: "सूचना लोड करता आल्या नाहीत",
          loading: "लोड होत आहे...",
          saving: "जतन होत आहे...",
          noNewAlerts: "पाहिले म्हणून चिन्हांकित करण्यासाठी नवीन सूचना नाहीत.",
          updateError: "सूचना अद्ययावत करता आल्या नाहीत",
          allSeen: "सध्याच्या सर्व सूचना पाहिल्या म्हणून चिन्हांकित केल्या.",
          pushUnsupported: "या उपकरणावर पार्श्वभूमीतील पुश सूचना समर्थित नाहीत.",
          pushConfigError: "पुश मांडणी लोड करता आली नाही",
          pushSaveError: "उपकरणाची पुश सदस्यता जतन करता आली नाही",
        },
      };

      function getNotificationsText() {
        return notificationsTranslations[hotelAdminCommon.getLanguage()] || notificationsTranslations.en;
      }

      function applyNotificationsLanguage() {
        const text = getNotificationsText();
        document.title = text.title;
        document.getElementById("notificationsBackLink").textContent = text.back;
        document.getElementById("notificationsBadge").textContent = text.badge;
        document.getElementById("notificationsHeroTitle").textContent = text.heroTitle;
        document.getElementById("notificationsHeroBody").textContent = text.heroBody;
        document.getElementById("notificationsTokenLabel").textContent = text.tokenLabel;
        document.getElementById("notificationsHotelIdLabel").textContent = text.hotelIdLabel;
        enableNotificationsButton.textContent = text.enableButton;
        loadButton.textContent = text.loadButton;
        document.getElementById("permissionLabel").textContent = text.permissionLabel;
        document.getElementById("unseenLabel").textContent = text.unseenLabel;
        document.getElementById("latestAlertsTitle").textContent = text.latestTitle;
        markAllSeenButton.textContent = text.markAll;
      }

      hotelAdminCommon.hydrateContext(tokenInput, hotelIdInput);
      applyNotificationsLanguage();

      function updatePermissionState() {
        const text = getNotificationsText();
        permissionState.textContent = "Notification" in window ? Notification.permission : text.permissionUnsupported;
      }

      function localNotifiedKey(hotelId) {
        return `hotel_notification_locally_notified_${hotelId}`;
      }

      function getLocallyNotifiedIds(hotelId) {
        try {
          return JSON.parse(localStorage.getItem(localNotifiedKey(hotelId)) || "[]");
        } catch {
          return [];
        }
      }

      function setLocallyNotifiedIds(hotelId, ids) {
        localStorage.setItem(localNotifiedKey(hotelId), JSON.stringify(ids.slice(0, 80)));
      }

      async function showDeviceNotification(item) {
        const registration = await navigator.serviceWorker.getRegistration();
        if (registration) {
          await registration.showNotification(item.title, {
            body: item.message,
            icon: "/home-screen.webp",
            badge: "/home-screen.webp",
            data: {
              url: item.action_url || "/hotel-admin-home.html",
            },
          });
          return;
        }

        new Notification(item.title, {
          body: item.message,
          icon: "/home-screen.webp",
        });
      }

      function urlBase64ToUint8Array(base64String) {
        const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
        const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
        const rawData = atob(base64);
        const outputArray = new Uint8Array(rawData.length);

        for (let index = 0; index < rawData.length; ++index) {
          outputArray[index] = rawData.charCodeAt(index);
        }

        return outputArray;
      }

      async function maybeNotifyUnseen(items) {
        const hotelId = hotelIdInput.value.trim();
        if (!hotelId || !("Notification" in window) || Notification.permission !== "granted") {
          return;
        }

        const notifiedIds = getLocallyNotifiedIds(hotelId);
        const newIds = [...notifiedIds];

        for (const item of items.filter((row) => Number(row.is_seen) !== 1)) {
          if (notifiedIds.includes(item.id)) {
            continue;
          }
          await showDeviceNotification(item);
          newIds.unshift(item.id);
        }

        setLocallyNotifiedIds(hotelId, Array.from(new Set(newIds)));
      }

      function renderNotifications(items) {
        notificationsList.innerHTML = "";
        unseenCount.textContent = String(items.filter((row) => Number(row.is_seen) !== 1).length);

        if (!items.length) {
          notificationsList.innerHTML = `<div class="rounded-2xl bg-slate-50 px-4 py-3 text-sm text-slate-600">${getNotificationsText().empty}</div>`;
          return;
        }

        for (const item of items) {
          const card = document.createElement("article");
          card.className = "rounded-2xl px-4 py-4 text-sm " + (Number(item.is_seen) === 1
            ? "border border-slate-200 bg-slate-50 text-slate-600"
            : "border border-amber-200 bg-amber-50 text-amber-900");
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="font-semibold ${Number(item.is_seen) === 1 ? "text-slate-900" : "text-amber-950"}">${item.title}</p>
                <p class="mt-1 leading-6">${item.message}</p>
              </div>
              <span class="rounded-full px-3 py-1 text-[11px] font-semibold uppercase tracking-[0.16em] ${Number(item.is_seen) === 1 ? "bg-white text-slate-500" : "bg-white text-amber-700"}">
                ${Number(item.is_seen) === 1 ? getNotificationsText().seen : getNotificationsText().new}
              </span>
            </div>
            <p class="mt-2 text-xs uppercase tracking-[0.16em] ${Number(item.is_seen) === 1 ? "text-slate-500" : "text-amber-700"}">${item.notification_type} • ${item.audience_type.replaceAll("_", " ")}</p>
            <p class="mt-1 text-xs ${Number(item.is_seen) === 1 ? "text-slate-500" : "text-amber-800"}">${getNotificationsText().from}: ${item.created_by}</p>
            <p class="mt-1 text-xs ${Number(item.is_seen) === 1 ? "text-slate-500" : "text-amber-800"}">${getNotificationsText().sent}: ${item.created_at}</p>
            <div class="mt-3 flex gap-2">
              ${item.action_url ? `<a href="${item.action_url}" class="rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700">${getNotificationsText().openPage}</a>` : ""}
              ${Number(item.is_seen) === 1 ? "" : `<button type="button" class="mark-seen-button rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs font-medium text-slate-700" data-id="${item.id}">${getNotificationsText().markSeen}</button>`}
            </div>
          `;
          notificationsList.appendChild(card);
        }

        for (const button of notificationsList.querySelectorAll(".mark-seen-button")) {
          button.addEventListener("click", async () => {
            try {
              await fetch("/api/hotel-admin/notifications", {
                method: "POST",
                headers: hotelAdminCommon.authHeaders(tokenInput),
                body: JSON.stringify({
                  action: "mark_seen",
                  hotel_id: hotelIdInput.value.trim(),
                  notification_id: button.dataset.id,
                }),
              });
              await loadNotifications();
            } catch {}
          });
        }
      }

      async function loadNotifications() {
        hotelAdminCommon.persistContext(tokenInput.value.trim(), hotelIdInput.value.trim());
        const response = await fetch(`/api/hotel-admin/notifications?hotel_id=${encodeURIComponent(hotelIdInput.value.trim())}`, {
          headers: hotelAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await hotelAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || getNotificationsText().loadError);
        }
        renderNotifications(data.notifications || []);
        await maybeNotifyUnseen(data.notifications || []);
      }

      async function enableRealPushSubscription() {
        if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
          throw new Error(getNotificationsText().pushUnsupported);
        }

        const response = await fetch("/api/hotel-admin/push-subscription", {
          headers: hotelAdminCommon.authHeaders(tokenInput, false),
        });
        const data = await hotelAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || getNotificationsText().pushConfigError);
        }

        const registration = await navigator.serviceWorker.ready;
        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(data.vapidPublicKey),
          });
        }

        activePushSubscription = subscription;

        const jsonSubscription = subscription.toJSON();
        const saveResponse = await fetch("/api/hotel-admin/push-subscription", {
          method: "POST",
          headers: hotelAdminCommon.authHeaders(tokenInput),
          body: JSON.stringify({
            hotel_id: hotelIdInput.value.trim(),
            endpoint: jsonSubscription.endpoint,
            p256dh: jsonSubscription.keys?.p256dh,
            auth: jsonSubscription.keys?.auth,
            user_agent: navigator.userAgent,
          }),
        });
        const saveData = await hotelAdminCommon.readJson(saveResponse);
        if (!saveResponse.ok) {
          throw new Error(saveData.error || getNotificationsText().pushSaveError);
        }
      }

      enableNotificationsButton.addEventListener("click", async () => {
        if (!("Notification" in window)) {
          hotelAdminCommon.setMessage(statusBox, getNotificationsText().noBrowserSupport, "error");
          updatePermissionState();
          return;
        }

        try {
          const result = await Notification.requestPermission();
          updatePermissionState();
          if (result !== "granted") {
            hotelAdminCommon.setMessage(statusBox, getNotificationsText().permissionDenied, "error");
            return;
          }

          await enableRealPushSubscription();
          hotelAdminCommon.setMessage(statusBox, getNotificationsText().enabled, "success");
        } catch (error) {
          hotelAdminCommon.setMessage(statusBox, error instanceof Error ? error.message : getNotificationsText().enableError, "error");
        }
      });

      loadButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(statusBox);
        hotelAdminCommon.setButtonLoading(loadButton, true, getNotificationsText().loading);
        try {
          await loadNotifications();
        } catch (error) {
          hotelAdminCommon.setMessage(statusBox, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(loadButton, false);
        }
      });

      markAllSeenButton.addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(statusBox);
        hotelAdminCommon.setButtonLoading(markAllSeenButton, true, getNotificationsText().saving);
        try {
          const cards = Array.from(notificationsList.querySelectorAll(".mark-seen-button")).map((button) => button.dataset.id).filter(Boolean);
          if (!cards.length) {
            hotelAdminCommon.setMessage(statusBox, getNotificationsText().noNewAlerts, "success");
            return;
          }

          const response = await fetch("/api/hotel-admin/notifications", {
            method: "POST",
            headers: hotelAdminCommon.authHeaders(tokenInput),
            body: JSON.stringify({
              action: "mark_many_seen",
              hotel_id: hotelIdInput.value.trim(),
              notification_ids: cards,
            }),
          });
          const data = await hotelAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || getNotificationsText().updateError);
          }

          hotelAdminCommon.setMessage(statusBox, getNotificationsText().allSeen, "success");
          await loadNotifications();
        } catch (error) {
          hotelAdminCommon.setMessage(statusBox, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(markAllSeenButton, false);
        }
      });

      updatePermissionState();

      if (tokenInput.value.trim() && hotelIdInput.value.trim()) {
        loadNotifications().catch(() => {});
      }

      setInterval(() => {
        if (tokenInput.value.trim() && hotelIdInput.value.trim()) {
          loadNotifications().catch(() => {});
        }
      }, 60000);
    </script>
  </body>
</html>
