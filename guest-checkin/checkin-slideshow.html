  </head><body><main id="deck"></main><div class="dots" id="dots"></div><nav><button id="prev">←</button><span><b id="count">1</b> / 12</span><button id="next">→</button></nav><script>const card=(a,c='')=>`<div class="cards ${c}">${a.map((x,i)=>`<div class="card"><b>${['▣','▦','⚑','◎','✦','◉','◌','☁'][i]}</b>${x}</div>`).join('')}</div>`;const s=(k,e,t,c='',x='',img='')=>`<article class="slide ${k}">${img?`<img class="bg" src="${img}">`:''}<div class="veil"></div><b class="no"></b><div class="inside"><p class="eye">${e}</p><h1 class="title">${t}</h1>${c?`<p class="copy">${c}</p>`:''}${x}</div></article>`;const html=[s('cover','HOTEL OPERATING SYSTEM','CHECKIN','तुम्ही पाहुण्यांची काळजी घ्या…\nव्यवस्थापनाची काळजी CHECKIN घेईल.','<p class="sub">आधुनिक • स्मार्ट • सुरक्षित</p>','home-screen.webp'),s('why','FEATURES','CHECKIN चे 5 मुख्य फायदे','सोपे • वेगवान • कागदविरहित • पूर्णपणे डिजिटल',card(['QR Self Check-In','Reservation Calendar','Overbooking Alert','Free Hotel Webpage','FREE till 31 Oct 2026'])),s('qr media','01','QR Self Check-In','पाहुणे स्वतः QR Code स्कॅन करून मोबाइलवर चेक-इन माहिती भरतात.','<aside class="phone"><strong>CHECKIN</strong><img src="hotel-dashboard-qr.svg"><b>Room No.<br>101</b></aside>'),s('calendar-slide','02','Reservation Calendar','सर्व भविष्यातील बुकिंग्स एका नजरेत. नियोजन सोपे, चुका कमी.','<aside class="calendar"><strong>June 2026</strong><p>S M T W T F S<br>1 2 3 4 5 6 7<br>8 9 10 11 12 13 14<br>15 16 17 18 19 20 21<br>22 23 24 25 26 27 28</p><i>Sea View Room</i><i>Deluxe Room</i></aside>'),s('alert','03','One-Click Overbooking Alert','एका क्लिकमध्ये ओव्हरबुकिंगची माहिती सर्व सहभागी हॉटेल्सना पाठवा.','<aside class="flow"><b>SEND OVERBOOKING ALERT</b><span>↙　↓　↘</span><i>🏨　🏨　🏨　🏨</i></aside>'),s('web media','04','Free Hotel Webpage','प्रत्येक सहभागी हॉटेलला स्वतःचे सुंदर, मोबाइल-फ्रेंडली हॉटेल वेबपेज.','','home-screen.webp'),s('features','05','प्रगत आणि स्मार्ट वैशिष्ट्ये','दैनंदिन हॉटेल व्यवस्थापनासाठी आवश्यक सर्व काही, एकाच ठिकाणी.',card(['Dashboard','Guest Management','Room Management','Staff Management','Police Register','GST Ready Billing','WhatsApp / SMS Alerts','Google Drive Backup'],'grid8')),s('promise','CHECKIN','तुम्ही पाहुण्यांची काळजी घ्या…','व्यवस्थापनाची काळजी CHECKIN घेईल.','','home-screen.webp'),s('story media','WHY I BUILT CHECKIN','अनुभवातून निर्माण, विश्वासासाठी समर्पित','मी 30 वर्षे परदेशी शिपिंग कंपन्यांमध्ये Chief Engineer म्हणून काम केले. त्या अनुभवातून CHECKIN हा हॉटेल व्यवसायासाठी तयार केला आहे.','','akshy-qr.webp'),s('free','LIMITED-TIME LAUNCH OFFER','31 ऑक्टोबर 2026 पर्यंत पूर्णपणे मोफत!','आत्ताच वापरून पहा. कोणतेही बंधन नाही.','<aside class="gift">🎁<b>FREE</b></aside>'),s('pricing','SIMPLE PRICING','नंतरचे शुल्क अतिशय कमी','फक्त अपडेट्स, सपोर्ट आणि नवीन सुविधांसाठी.','<div class="prices"><div class="price"><b>₹10</b><span>प्रति खोली प्रति महिना</span></div><i class="or">किंवा</i><div class="price"><b>₹100</b><span>प्रति खोली प्रति वर्ष</span></div></div>'),s('contact media','START TODAY','संपर्क','गिरीश जगन्नाथ पाटील\nHotels In Alibaug\n☎ 9769766678  •  72089 93889\n✉ checkin.hotelsinalibaug@gmail.com','','home-screen.webp')];deck.innerHTML=html.join('');const a=[...document.querySelectorAll('.slide')];a.forEach((e,i)=>e.querySelector('.no').textContent=String(i+1).padStart(2,'0'));dots.innerHTML=a.map((_,i)=>`<button class="dot" data-i="${i}"></button>`).join('');let n=0;function show(i){n=(i+a.length)%a.length;a.forEach((e,j)=>e.classList.toggle('on',j===n));document.querySelectorAll('.dot').forEach((e,j)=>e.classList.toggle('sel',j===n));count.textContent=n+1;history.replaceState(null,'',`#slide-${n+1}`)}prev.onclick=()=>show(n-1);next.onclick=()=>show(n+1);dots.onclick=e=>e.target.dataset.i&&show(+e.target.dataset.i);onkeydown=e=>{if(e.key==='ArrowRight'||e.key===' ')show(n+1);if(e.key==='ArrowLeft')show(n-1)};show(location.hash?+location.hash.replace('#slide-','')-1:0)</script></body></html>
