<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guest Check-Out</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="hotel-admin-common.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: "#0b1824",
              harbor: "#17324a",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div class="flex items-center justify-between text-sm">
        <a href="/hotel-admin-home.html" class="font-medium text-slate-600">Back to Home</a>
        <span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Guests</span>
      </div>
      <script>
        document.write(hotelAdminCommon.quickNav("guests"));
      </script>
      <section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white">
          <h1 class="text-2xl font-semibold">Guest Check-Out</h1>
          <p class="mt-2 text-sm leading-6 text-white/80">Search current in-house guests by name, room, phone, or guest ID and complete checkout without opening a larger dashboard.</p>
        </div>

        <div class="p-5">
          <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            This page is only for current in-house guests and check-out actions. Search updates automatically.
          </div>
          <div class="space-y-4">
            <div>
              <label for="hotelAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Hotel Admin Token</label>
              <input id="hotelAdminToken" type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Hotel Admin token">
            </div>
            <div class="grid gap-3 sm:grid-cols-[1fr_auto]">
              <div>
                <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel ID</label>
                <input id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Hotel ID">
              </div>
              <button id="loadButton" type="button" class="rounded-2xl bg-ocean px-5 py-3 font-semibold text-white sm:self-end">Load Guests</button>
            </div>
            <div>
              <label for="guestSearch" class="mb-2 block text-sm font-medium text-slate-700">Search Current Guests</label>
              <input id="guestSearch" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Search name, room, phone, or guest ID">
            </div>
          </div>
          <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>

          <div id="guestListState" class="mt-5 rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm text-slate-600">Load a hotel to see checked-in guests.</div>
          <div id="guestList" class="mt-4 grid gap-3"></div>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("hotelAdminToken");
      const hotelIdInput = document.getElementById("hotelId");
      const pageMessage = document.getElementById("pageMessage");
      const guestListState = document.getElementById("guestListState");
      const guestList = document.getElementById("guestList");
      const loadButton = document.getElementById("loadButton");
      let guestSearchTimeout = null;

      hotelAdminCommon.hydrateContext(tokenInput, hotelIdInput);

      async function loadGuests() {
        hotelAdminCommon.persistContext(tokenInput.value.trim(), hotelIdInput.value.trim());
        guestListState.textContent = "Loading current guests...";
        guestList.innerHTML = "";

        const url = new URL("/api/hotel-admin/guests", window.location.origin);
        url.searchParams.set("hotel_id", hotelIdInput.value.trim());
        url.searchParams.set("status", "current");
        if (document.getElementById("guestSearch").value.trim()) {
          url.searchParams.set("q", document.getElementById("guestSearch").value.trim());
        }

        const response = await fetch(url.toString(), {
          headers: hotelAdminCommon.authHeaders(tokenInput),
        });
        const data = await hotelAdminCommon.readJson(response);
        if (!response.ok) {
          throw new Error(data.error || "Unable to load guests");
        }

        const guests = data.guests || [];
        if (!guests.length) {
          guestListState.textContent = "No currently checked-in guests matched this search.";
          return;
        }

        guestListState.textContent = `${guests.length} current guest${guests.length === 1 ? "" : "s"} loaded.`;
        for (const guest of guests) {
          const card = document.createElement("article");
          card.className = "rounded-2xl bg-slate-50 p-4";
          card.innerHTML = `
            <p class="font-semibold text-slate-900">${guest.name}</p>
            <p class="mt-1 text-sm text-slate-600">Room ${guest.room_number} • ${guest.phone || "No phone"}</p>
            <p class="mt-1 text-sm text-slate-600">Expected check-out: ${guest.expected_check_out_date || "Not set"}</p>
            <button type="button" class="mt-3 inline-flex w-full items-center justify-center rounded-2xl bg-slate-900 px-4 py-3 text-sm font-semibold text-white" data-id="${guest.id}" data-name="${guest.name}" data-room="${guest.room_number}">
              Check Out Guest
            </button>
          `;

          card.querySelector("button").addEventListener("click", async (event) => {
            const button = event.currentTarget;
            const confirmed = window.confirm(`Check out ${button.dataset.name} from room ${button.dataset.room}?`);
            if (!confirmed) {
              return;
            }

            try {
              const response = await fetch("/api/hotel-admin/guests", {
                method: "POST",
                headers: hotelAdminCommon.authHeaders(tokenInput),
                body: JSON.stringify({
                  hotel_id: hotelIdInput.value.trim(),
                  guest_id: button.dataset.id,
                }),
              });
              const data = await hotelAdminCommon.readJson(response);
              if (!response.ok) {
                throw new Error(data.error || "Unable to check out guest");
              }
              hotelAdminCommon.setMessage(pageMessage, `${button.dataset.name} checked out successfully.`, "success");
              await loadGuests();
            } catch (error) {
              hotelAdminCommon.setMessage(pageMessage, error.message, "error");
            }
          });

          guestList.appendChild(card);
        }
      }

      document.getElementById("loadButton").addEventListener("click", async () => {
        hotelAdminCommon.clearMessage(pageMessage);
        hotelAdminCommon.setButtonLoading(loadButton, true, "Loading...");
        try {
          await loadGuests();
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(loadButton, false);
        }
      });

      document.getElementById("guestSearch").addEventListener("input", () => {
        clearTimeout(guestSearchTimeout);
        guestSearchTimeout = setTimeout(async () => {
          if (!hotelIdInput.value.trim()) {
            return;
          }
          try {
            await loadGuests();
          } catch {}
        }, 250);
      });

      if (tokenInput.value.trim() && hotelIdInput.value.trim()) {
        loadGuests().catch(() => {});
      }
    </script>
  </body>
</html>
