<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Police Hotel Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="police-reports-common.js?v=20260725-2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111827",
              slateblue: "#1f3b57",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f8fafc_0%,#eef2f6_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(policeReportsCommon.pageChrome("Hotel Details", "Hotel", "View the selected hotel’s details, occupancy snapshot, and current high-level status."));
      </script>
        <script>
          document.write(policeReportsCommon.quickNav("hotel"));
        </script>
        <div class="p-5">
          <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Use this page first when you want the hotel identity and occupancy snapshot before checking guests or logs.
          </div>
          <div class="space-y-4">
            <div>
              <label for="policeToken" class="mb-2 block text-sm font-medium text-slate-700">Saved Session</label>
              <input id="policeToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <div>
              <label for="officerName" class="mb-2 block text-sm font-medium text-slate-700">Officer Name</label>
              <input id="officerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <div>
              <label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Filter Hotels</label>
              <input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Search hotel name or hotel ID">
            </div>
            <div>
              <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label>
              <select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
                <option value="">Load hotels after login</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
              <input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ink px-5 py-3 font-semibold text-white">Load Report</button>
            <div>
              <label for="hotelDetailsFilter" class="mb-2 block text-sm font-medium text-slate-700">Search Details</label>
              <input id="hotelDetailsFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Search by hotel name, mobile, email, address, or hotel ID">
            </div>
            <div id="errorBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>

          <div class="mt-5 grid grid-cols-3 gap-3">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Guests</p>
              <p id="metricGuests" class="mt-2 text-xl font-semibold text-ink">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Staff</p>
              <p id="metricStaff" class="mt-2 text-xl font-semibold text-ink">0</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-xs uppercase tracking-[0.18em] text-slate-500">Rooms</p>
              <p id="metricRooms" class="mt-2 text-xl font-semibold text-ink">0 / 0</p>
            </div>
          </div>

          <div id="hotelDetails" class="mt-5 text-sm text-slate-600">Load a report to view hotel details.</div>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("policeToken");
      const officerNameInput = document.getElementById("officerName");
      const hotelFilterInput = document.getElementById("hotelFilter");
      const hotelIdInput = document.getElementById("hotelId");
      const fromDateInput = document.getElementById("fromDate");
      const toDateInput = document.getElementById("toDate");
      const loadButton = document.getElementById("loadButton");
      const hotelDetailsFilterInput = document.getElementById("hotelDetailsFilter");
      const errorBox = document.getElementById("errorBox");
      const metricGuests = document.getElementById("metricGuests");
      const metricStaff = document.getElementById("metricStaff");
      const metricRooms = document.getElementById("metricRooms");
      const hotelDetails = document.getElementById("hotelDetails");
      let lastHotelData = null;

      policeReportsCommon.hydrateFilters(tokenInput, officerNameInput, hotelIdInput, fromDateInput, toDateInput);
      policeReportsCommon.attachHotelFilter(hotelFilterInput, hotelIdInput);

      function renderHotelDetails(hotel) {
        const lines = [
          ["Hotel ID", hotel.id],
          ["Mobile", hotel.contact || "-"],
          ["Admin Email", hotel.admin_email || "-"],
          ["Address", hotel.address || "-"],
          ["Rooms", `${hotel.occupied_rooms || 0}/${hotel.total_rooms || 0}`],
        ];
        const filterValue = policeReportsCommon.normalizeFilterValue(hotelDetailsFilterInput.value);
        const visibleLines = !filterValue
          ? lines
          : lines.filter(([label, value]) =>
              policeReportsCommon.normalizeFilterValue(`${label} ${value}`).includes(filterValue)
            );
        const hotelNameVisible = !filterValue
          || policeReportsCommon.normalizeFilterValue(hotel.name).includes(filterValue);

        hotelDetails.innerHTML = `
          <div class="rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4">
            <h3 class="text-lg font-semibold text-ink">${hotelNameVisible ? hotel.name : "Selected Hotel"}</h3>
            ${visibleLines.length
              ? visibleLines.map(([label, value]) => policeReportsCommon.createLine(label, value)).join("")
              : '<p class="mt-3 text-sm text-slate-500">No hotel detail matched this filter.</p>'}
          </div>
        `;
      }

      async function initHotels() {
        if (tokenInput.value.trim()) {
          await policeReportsCommon.loadHotels(tokenInput, hotelIdInput);
          policeReportsCommon.showBox(errorBox, "Saved police filters loaded. Tap Load Report when ready.", "success");
        }
      }

      async function loadSection() {
        policeReportsCommon.clearBox(errorBox);
        const data = await policeReportsCommon.loadReport({ tokenInput, officerNameInput, hotelIdInput, fromDateInput, toDateInput });
        const { hotel, summary } = data;
        lastHotelData = hotel;
        metricGuests.textContent = summary.current_in_house_guests;
        metricStaff.textContent = summary.active_staff;
        metricRooms.textContent = `${summary.occupied_rooms} / ${summary.total_rooms}`;
        renderHotelDetails(hotel);
      }

      loadButton.addEventListener("click", async () => {
        policeReportsCommon.setButtonLoading(loadButton, true, "Loading...");
        try {
          await loadSection();
        } catch (error) {
          policeReportsCommon.showBox(errorBox, error instanceof Error ? error.message : "Unable to load report", "error");
        } finally {
          policeReportsCommon.setButtonLoading(loadButton, false);
        }
      });

      hotelDetailsFilterInput.addEventListener("input", () => {
        if (!lastHotelData) {
          return;
        }
        renderHotelDetails(lastHotelData);
      });

      initHotels().catch(() => {});
    </script>
  </body>
</html>
