<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super Admin Police Current Guests</title><script src="https://cdn.tailwindcss.com"></script><script src="super-admin-reports-common.js?v=20260723-1"></script>    <link rel="stylesheet" href="/three-d-surfaces.css">
  </head><body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><script>document.write(superAdminReportsCommon.pageChrome("Current Guests","Current","Review current guests for one hotel with proof access."));</script><div class="p-5"><div class="space-y-4"><input id="superAdminToken" type="password" class="hidden"><div><label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label><input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div><label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Filter Hotels</label><input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search hotel name or hotel ID"></div><div><label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label><select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><option value="">Load hotels</option></select></div><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Load Current Guests</button><input id="guestFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search guest, mobile, room, car number, or expected check-out"><div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div id="listBox" class="mt-4 space-y-3"></div></div></section></main><script>const tokenInput=document.getElementById("superAdminToken"),viewerNameInput=document.getElementById("viewerName"),hotelFilterInput=document.getElementById("hotelFilter"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),guestFilter=document.getElementById("guestFilter"),statusBox=document.getElementById("statusBox"),stateBox=document.getElementById("stateBox"),listBox=document.getElementById("listBox");let hotels=[],lastData=null;superAdminReportsCommon.hydrateFilters(tokenInput,viewerNameInput,fromDateInput,toDateInput);hotelIdInput.dataset.preselectedHotelId=new URLSearchParams(window.location.search).get("hotel_id")||localStorage.getItem("super_admin_police_hotel_id")||"";async function initHotels(){hotels=await superAdminReportsCommon.loadHotels();superAdminReportsCommon.renderHotelOptions(hotelIdInput,hotels);superAdminReportsCommon.attachHotelFilter(hotelFilterInput,hotelIdInput,hotels);}function filteredRows(rows){const q=superAdminReportsCommon.normalizeFilterValue(guestFilter.value);if(!q){return rows;}return rows.filter((guest)=>[guest.name,guest.room_number,guest.phone,guest.vehicle_number,guest.expected_check_out_date].filter(Boolean).some((value)=>superAdminReportsCommon.normalizeFilterValue(value).includes(q)));}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} current guest row${filtered.length===1?"":"s"} loaded.`;superAdminReportsCommon.renderCards(listBox,filtered,"No current guests found.",(guest)=>`<h3 class="text-base font-semibold text-ocean-950">${guest.name}</h3>${superAdminReportsCommon.createLine("Room",guest.room_number||"-")}${superAdminReportsCommon.createLine("Guests",guest.total_guests||1)}${superAdminReportsCommon.createLine("Phone",guest.phone||"-")}${superAdminReportsCommon.createLine("Car Number",guest.vehicle_number||"-")}${superAdminReportsCommon.createLine("Expected Check-Out",guest.expected_check_out_date||"-")}${superAdminReportsCommon.proofButtons(guest)}`);superAdminReportsCommon.attachProofButtons(listBox,tokenInput,viewerNameInput,statusBox);}async function loadSection(){superAdminReportsCommon.clearMessage(statusBox);const data=await superAdminReportsCommon.loadHotelReport({tokenInput,viewerNameInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.current_guests||[]);}loadButton.addEventListener("click",async()=>{superAdminReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load report","error");}finally{superAdminReportsCommon.setButtonLoading(loadButton,false);}});guestFilter.addEventListener("input",()=>{if(lastData?.reports?.current_guests){renderRows(lastData.reports.current_guests);}});initHotels().catch((error)=>superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load hotels","error"));</script></body></html>
