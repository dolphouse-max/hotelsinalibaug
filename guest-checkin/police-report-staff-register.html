<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Police Staff Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="police-reports-common.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111827",
              slateblue: "#1f3b57",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f8fafc_0%,#eef2f6_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <script>
        document.write(policeReportsCommon.pageChrome("Staff Register", "Staff", "View the selected hotel’s staff register with role, phone, email, and active status."));
      </script>
        <script>
          document.write(policeReportsCommon.quickNav("staff"));
        </script>
        <div class="p-5">
          <div class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Search staff by name, role, phone, or email to review large hotel teams faster on mobile.
          </div>
          <div class="space-y-4">
            <div>
              <label for="policeToken" class="mb-2 block text-sm font-medium text-slate-700">Police Access Token</label>
              <input id="policeToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <div>
              <label for="officerName" class="mb-2 block text-sm font-medium text-slate-700">Officer Name</label>
              <input id="officerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <div>
              <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label>
              <select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
                <option value="">Load hotels after entering token</option>
              </select>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
              <input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
            </div>
            <div class="grid grid-cols-2 gap-3">
              <button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ink px-5 py-3 font-semibold text-white">Load Report</button>
              <button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button>
            </div>
            <div>
              <label for="staffFilter" class="mb-2 block text-sm font-medium text-slate-700">Search Staff</label>
              <input id="staffFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Search by name, role, phone, or email">
            </div>
            <div id="errorBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
          </div>

          <p id="staffRegisterState" class="mt-5 text-sm text-slate-600">No data loaded yet.</p>
          <div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white">
            <table class="min-w-full text-left text-sm">
              <thead class="text-slate-500">
                <tr>
                  <th class="px-3 py-2 font-medium">Staff</th>
                  <th class="px-3 py-2 font-medium">Role</th>
                  <th class="px-3 py-2 font-medium">Phone</th>
                  <th class="px-3 py-2 font-medium">Email</th>
                  <th class="px-3 py-2 font-medium">Status</th>
                </tr>
              </thead>
              <tbody id="staffRegisterTable" class="divide-y divide-slate-100"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("policeToken");
      const officerNameInput = document.getElementById("officerName");
      const hotelIdInput = document.getElementById("hotelId");
      const fromDateInput = document.getElementById("fromDate");
      const toDateInput = document.getElementById("toDate");
      const loadButton = document.getElementById("loadButton");
      const exportButton = document.getElementById("exportButton");
      const staffFilterInput = document.getElementById("staffFilter");
      const errorBox = document.getElementById("errorBox");
      const staffRegisterState = document.getElementById("staffRegisterState");
      const staffRegisterTable = document.getElementById("staffRegisterTable");
      let lastReportData = null;

      policeReportsCommon.hydrateFilters(tokenInput, officerNameInput, hotelIdInput, fromDateInput, toDateInput);

      async function initHotels() {
        if (tokenInput.value.trim()) {
          await policeReportsCommon.loadHotels(tokenInput, hotelIdInput);
          policeReportsCommon.showBox(errorBox, "Saved police filters loaded. Tap Load Report when ready.", "success");
        }
      }

      function normalizeFilterValue(value) {
        return String(value || "").trim().toLowerCase();
      }

      function applyStaffFilter(staffRows) {
        const filterValue = normalizeFilterValue(staffFilterInput.value);
        if (!filterValue) {
          return staffRows;
        }

        return staffRows.filter((staff) =>
          [
            staff.full_name,
            staff.role,
            staff.phone,
            staff.email,
          ]
            .filter(Boolean)
            .some((value) => normalizeFilterValue(value).includes(filterValue))
        );
      }

      function renderStaffRegister(staffRows) {
        const filteredStaffRows = applyStaffFilter(staffRows);
        staffRegisterState.textContent = `${filteredStaffRows.length} staff row${filteredStaffRows.length === 1 ? "" : "s"} loaded.`;
        policeReportsCommon.renderTable(
          staffRegisterTable,
          filteredStaffRows.map((staff) => {
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="px-3 py-3 font-medium text-ink">${staff.full_name}</td>
              <td class="px-3 py-3 text-slate-600">${staff.role || "-"}</td>
              <td class="px-3 py-3 text-slate-600">${staff.phone || "-"}</td>
              <td class="px-3 py-3 text-slate-600">${staff.email || "-"}</td>
              <td class="px-3 py-3 text-slate-600">${Number(staff.is_active) === 1 ? "Active" : "Inactive"}</td>
            `;
            return tr;
          }),
          5,
          "No staff register rows found."
        );
      }

      async function loadSection() {
        policeReportsCommon.clearBox(errorBox);
        const data = await policeReportsCommon.loadReport({ tokenInput, officerNameInput, hotelIdInput, fromDateInput, toDateInput });
        lastReportData = data;
        renderStaffRegister(data.reports.staff_register || []);
      }

      loadButton.addEventListener("click", async () => {
        policeReportsCommon.setButtonLoading(loadButton, true, "Loading...");
        try {
          await loadSection();
        } catch (error) {
          policeReportsCommon.showBox(errorBox, error instanceof Error ? error.message : "Unable to load report", "error");
        } finally {
          policeReportsCommon.setButtonLoading(loadButton, false);
        }
      });

      exportButton.addEventListener("click", () => {
        if (!lastReportData?.reports?.staff_register?.length) {
          policeReportsCommon.showBox(errorBox, "There is no data to export yet.", "error");
          return;
        }
        const rows = [["Staff Name", "Role", "Phone", "Email", "Status", "Working Since Month", "Working Since Year"]];
        for (const staff of applyStaffFilter(lastReportData.reports.staff_register)) {
          rows.push([staff.full_name, staff.role, staff.phone, staff.email, Number(staff.is_active) === 1 ? "Active" : "Inactive", staff.working_since_month, staff.working_since_year]);
        }
        policeReportsCommon.downloadCsv("staff-register.csv", rows);
      });

      staffFilterInput.addEventListener("input", () => {
        if (!lastReportData?.reports?.staff_register) {
          return;
        }
        renderStaffRegister(lastReportData.reports.staff_register);
      });

      initHotels().catch(() => {});
    </script>
  </body>
</html>
