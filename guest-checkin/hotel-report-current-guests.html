<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Current Guests</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js?v=20260718-1"></script><script src="hotel-reports-common.js?v=20260718-1"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script></head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a id="backLink" href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span id="badge" class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Current</span></div><script>document.write(hotelReportsCommon.quickNav("current"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 id="heroTitle" class="text-2xl font-semibold">Current Guests</h1><p id="heroBody" class="mt-2 text-sm leading-6 text-white/80">Review all currently in-house guests.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><input id="guestFilter" placeholder="Search guest, phone, room, or check-out date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div id="listBox" class="mt-4 space-y-3"></div></div></section></main><script>const tokenInput=null,hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),guestFilter=document.getElementById("guestFilter"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),listBox=document.getElementById("listBox");let lastData=null;const pageText={en:{title:"Current Guests",back:"Back to Reports Home",badge:"Current",heroTitle:"Current Guests",heroBody:"Review all currently in-house guests.",hotelId:"Hotel ID",load:"Load Report",filter:"Search guest, phone, room, or check-out date",emptyStart:"No data loaded yet.",rows:(c)=>`${c} current guest row${c===1?"":"s"} loaded.`,empty:"No current guests found.",room:"Room",guests:"Guests",phone:"Phone",expected:"Expected Check-Out",loading:"Loading...",error:"Unable to load report"},mr:{title:"सध्याचे गेस्ट",back:"रिपोर्ट्स मुख्यपृष्ठावर परत",badge:"सध्याचे",heroTitle:"सध्याचे गेस्ट",heroBody:"सध्या राहणारे सर्व गेस्ट पहा.",hotelId:"हॉटेल आयडी",load:"रिपोर्ट लोड करा",filter:"गेस्ट, फोन, रूम किंवा चेक-आउट तारीख शोधा",emptyStart:"अजून माहिती लोड केलेली नाही.",rows:(c)=>`${c} सध्याच्या गेस्ट नोंदी लोड झाल्या.`,empty:"सध्याचे कोणतेही गेस्ट सापडले नाहीत.",room:"रूम",guests:"गेस्ट",phone:"फोन",expected:"अपेक्षित चेक-आउट",loading:"लोड होत आहे...",error:"रिपोर्ट लोड करता आला नाही"}};hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);function t(){return pageText[hotelAdminCommon.getLanguage()]||pageText.en;}function applyLanguage(){const x=t();document.title=x.title;backLink.textContent=x.back;badge.textContent=x.badge;heroTitle.textContent=x.heroTitle;heroBody.textContent=x.heroBody;hotelIdInput.placeholder=x.hotelId;guestFilter.placeholder=x.filter;if(!loadButton.dataset.loading){loadButton.textContent=x.load;}if(!lastData){stateBox.textContent=x.emptyStart;}}function filteredRows(rows){const q=hotelReportsCommon.normalizeFilterValue(guestFilter.value);if(!q){return rows;}return rows.filter((guest)=>[guest.name,guest.room_number,guest.phone,guest.expected_check_out_date].filter(Boolean).some((value)=>hotelReportsCommon.normalizeFilterValue(value).includes(q)));}function renderRows(rows){const x=t(),filtered=filteredRows(rows);stateBox.textContent=x.rows(filtered.length);hotelReportsCommon.renderCards(listBox,filtered,x.empty,(guest)=>`<h3 class="text-base font-semibold text-ocean">${guest.name}</h3>${hotelReportsCommon.createLine(x.room,guest.room_number||"-")}${hotelReportsCommon.createLine(x.guests,guest.total_guests||1)}${hotelReportsCommon.createLine(x.phone,guest.phone||"-")}${hotelReportsCommon.createLine(x.expected,guest.expected_check_out_date||"-")}`);}async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.current_guests||[]);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,t().loading);try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:t().error,"error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);loadButton.textContent=t().load;}});guestFilter.addEventListener("input",()=>{if(lastData?.reports?.current_guests){renderRows(lastData.reports.current_guests);}});document.addEventListener("click",(event)=>{if(event.target instanceof HTMLElement&&event.target.closest(".hotel-language-button")){window.setTimeout(()=>{applyLanguage();if(lastData?.reports?.current_guests){renderRows(lastData.reports.current_guests);}},0);}});applyLanguage();if(hotelIdInput.value.trim()){loadButton.click();}</script></body></html>
