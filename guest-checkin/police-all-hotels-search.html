<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/home-screen.webp">
    <link rel="manifest" href="/manifest.json">
    <title>Police All Hotels Guest Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="police-reports-common.js?v=20260725-2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ink: "#111827",
              slateblue: "#1f3b57",
              signal: "#de7e4a",
            },
          },
        },
      };
    </script>
      <link rel="stylesheet" href="/three-d-surfaces.css">
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f8fafc_0%,#eef2f6_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div id="pageShell"></div>
    </main>

    <script>
      const pageShell = document.getElementById("pageShell");
      pageShell.innerHTML = `
        ${policeReportsCommon.pageChrome(
          "All Hotels Guest Search",
          "Search",
          "Search guests across all hotels using mobile number, guest name, or car number from a single police page."
        )}
          <div class="p-5">
            ${policeReportsCommon.quickNav("search")}
            <section class="mt-4 space-y-4">
              <div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>
              <div>
                <label for="policeToken" class="mb-2 block text-sm font-medium text-slate-700">Saved Session</label>
                <input id="policeToken" type="password" autocomplete="off" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Saved police login session">
              </div>
              <div>
                <label for="officerName" class="mb-2 block text-sm font-medium text-slate-700">Officer Name</label>
                <input id="officerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Enter officer name">
              </div>
              <div>
                <label for="searchInput" class="mb-2 block text-sm font-medium text-slate-700">Search Guest</label>
                <input id="searchInput" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10" placeholder="Name, mobile number, or car number">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label for="fromDate" class="mb-2 block text-sm font-medium text-slate-700">From Date</label>
                  <input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
                </div>
                <div>
                  <label for="toDate" class="mb-2 block text-sm font-medium text-slate-700">To Date</label>
                  <input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-slateblue focus:ring-4 focus:ring-slateblue/10">
                </div>
              </div>
              <div class="flex flex-wrap gap-2">
                <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slateblue hover:text-ink active:scale-[0.99]" data-range="today">
                  Today
                </button>
                <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slateblue hover:text-ink active:scale-[0.99]" data-range="7days">
                  Last 7 Days
                </button>
                <button type="button" class="date-chip rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 transition hover:border-slateblue hover:text-ink active:scale-[0.99]" data-range="30days">
                  Last 30 Days
                </button>
              </div>
              <button id="searchButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ink px-5 py-3 font-semibold text-white transition active:scale-[0.99] hover:bg-slateblue">
                Search All Hotels
              </button>
            </section>

            <section class="mt-5 rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4">
              <div class="flex items-center justify-between gap-3">
                <div>
                  <p class="text-sm font-semibold text-ink">Search Results</p>
                  <p id="resultsMeta" class="mt-1 text-sm text-slate-500">Enter at least 2 characters to search.</p>
                </div>
              </div>
              <div id="resultsList" class="mt-4 space-y-3"></div>
            </section>
          </div>
        </section>
      `;

      const tokenInput = document.getElementById("policeToken");
      const officerNameInput = document.getElementById("officerName");
      const searchInput = document.getElementById("searchInput");
      const fromDateInput = document.getElementById("fromDate");
      const toDateInput = document.getElementById("toDate");
      const dateChips = Array.from(document.querySelectorAll(".date-chip"));
      const searchButton = document.getElementById("searchButton");
      const statusBox = document.getElementById("statusBox");
      const resultsMeta = document.getElementById("resultsMeta");
      const resultsList = document.getElementById("resultsList");

      tokenInput.value = localStorage.getItem("police_access_token") || "";
      policeReportsCommon.hideSessionField(tokenInput);
      officerNameInput.value = localStorage.getItem("police_officer_name") || "";
      fromDateInput.value = localStorage.getItem("police_reports_from") || policeReportsCommon.formatDateOffset(29);
      toDateInput.value = localStorage.getItem("police_reports_to") || policeReportsCommon.formatDateOffset(0);

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      function buildLine(label, value) {
        return `<p class="mt-1 text-sm text-slate-500">${label}: <span class="font-medium text-slate-700">${escapeHtml(value || "-")}</span></p>`;
      }

      function setDateRange(daysBack) {
        const toDate = policeReportsCommon.formatDateOffset(0);
        const fromDate = policeReportsCommon.formatDateOffset(daysBack);
        fromDateInput.value = fromDate;
        toDateInput.value = toDate;
      }

      async function openProofDocument(url) {
        const response = await fetch(url);
        if (!response.ok) {
          const contentType = response.headers.get("content-type") || "";
          if (contentType.includes("application/json")) {
            const payload = await response.json().catch(() => ({}));
            throw new Error(payload.error || "Unable to open guest proof");
          }
          throw new Error("Unable to open guest proof");
        }

        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const proofWindow = window.open(objectUrl, "_blank", "noopener,noreferrer");
        if (!proofWindow) {
          URL.revokeObjectURL(objectUrl);
          throw new Error("Popup was blocked while opening guest proof");
        }
        setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);
      }

      function buildProofUrl(hotelId, guestId, side) {
        const url = new URL("/api/police/guest-proof", window.location.origin);
        url.searchParams.set("hotel_id", hotelId);
        url.searchParams.set("guest_id", guestId);
        url.searchParams.set("side", side);
        url.searchParams.set("officer_name", officerNameInput.value.trim());
        return url.toString();
      }

      function renderResults(guests) {
        resultsList.innerHTML = "";

        if (!guests.length) {
          resultsList.innerHTML = `<div class="rounded-[1.25rem] border border-slate-200 bg-white px-4 py-4 text-sm text-slate-500">No guest records matched this search.</div>`;
          return;
        }

        for (const guest of guests) {
          const card = document.createElement("article");
          card.className = "rounded-[1.5rem] border border-slate-200 bg-white p-4";
          card.innerHTML = `
            <div class="flex items-start justify-between gap-3">
              <div>
                <p class="text-base font-semibold text-ink">${escapeHtml(guest.name || "Guest")}</p>
                <p class="mt-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500">${escapeHtml(guest.hotel_name || guest.hotel_id || "Hotel")}</p>
              </div>
              <div class="rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-600">${escapeHtml(guest.hotel_id || "-")}</div>
            </div>
            ${buildLine("Mobile", guest.phone)}
            ${buildLine("Car Number", guest.vehicle_number)}
            ${buildLine("Room Number", guest.room_number)}
            ${buildLine("ID Proof", [guest.id_type, guest.id_number].filter(Boolean).join(" - "))}
            ${buildLine("Check In", guest.check_in_time)}
            ${buildLine("Check Out", guest.check_out_time || "Currently in house")}
            ${policeReportsCommon.familyMemberSummary(guest)}
            ${policeReportsCommon.proofButtons(guest).replaceAll('data-guest-id="', `data-hotel-id="${escapeHtml(guest.hotel_id)}" data-guest-id="`)}
          `;
          resultsList.appendChild(card);
        }
      }

      async function searchGuests() {
        const officerName = officerNameInput.value.trim();
        const query = searchInput.value.trim();

        if (!officerName) {
          policeReportsCommon.showBox(statusBox, "Please enter officer name.", "error");
          return;
        }

        if (query.length < 2) {
          policeReportsCommon.showBox(statusBox, "Please enter at least 2 characters to search.", "error");
          return;
        }

        localStorage.setItem("police_access_token", "__app_session__");
        localStorage.setItem("police_officer_name", officerName);
        localStorage.setItem("police_reports_from", fromDateInput.value);
        localStorage.setItem("police_reports_to", toDateInput.value);

        const url = new URL("/api/police/guest-search", window.location.origin);
        url.searchParams.set("officer_name", officerName);
        url.searchParams.set("q", query);
        url.searchParams.set("from", fromDateInput.value);
        url.searchParams.set("to", toDateInput.value);

        try {
          policeReportsCommon.clearBox(statusBox);
          policeReportsCommon.setButtonLoading(searchButton, true, "Searching...");
          const response = await fetch(url.toString());
          const data = await policeReportsCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || "Unable to search guests");
          }

          resultsMeta.textContent = `${data.count || 0} result(s) found for "${query}" from ${data.filters?.from || fromDateInput.value} to ${data.filters?.to || toDateInput.value}.`;
          renderResults(data.guests || []);
          policeReportsCommon.showBox(statusBox, "Search completed successfully.", "success");
        } catch (error) {
          resultsMeta.textContent = "Unable to load results.";
          renderResults([]);
          policeReportsCommon.showBox(statusBox, error instanceof Error ? error.message : "Unable to search guests", "error");
        } finally {
          policeReportsCommon.setButtonLoading(searchButton, false, "Searching...");
        }
      }

      resultsList.addEventListener("click", async (event) => {
        const button = event.target.closest(".proof-button");
        if (!button) {
          return;
        }

        const hotelId = button.dataset.hotelId || "";
        const guestId = button.dataset.guestId || "";
        const familyMemberId = button.dataset.familyMemberId || "";
        const side = button.dataset.side || "";

        if (!hotelId || !guestId || !side) {
          policeReportsCommon.showBox(statusBox, "Guest proof details are missing.", "error");
          return;
        }

        try {
          policeReportsCommon.clearBox(statusBox);
          const url = new URL(buildProofUrl(hotelId, guestId, side));
          if (familyMemberId) {
            url.searchParams.set("family_member_id", familyMemberId);
          }
          await openProofDocument(url.toString());
        } catch (error) {
          policeReportsCommon.showBox(statusBox, error instanceof Error ? error.message : "Unable to open guest proof", "error");
        }
      });

      for (const chip of dateChips) {
        chip.addEventListener("click", () => {
          const range = chip.dataset.range || "";
          if (range === "today") {
            setDateRange(0);
          } else if (range === "7days") {
            setDateRange(6);
          } else if (range === "30days") {
            setDateRange(29);
          }
        });
      }

      searchButton.addEventListener("click", searchGuests);
      searchInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
          event.preventDefault();
          searchGuests();
        }
      });

      policeReportsCommon.getSession().then((session) => {
        if (session) {
          tokenInput.value = "__app_session__";
        }
      }).catch(() => {});
    </script>
  </body>
</html>
