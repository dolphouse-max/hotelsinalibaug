<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Super Admin Police Hotel Details</title><script src="https://cdn.tailwindcss.com"></script><script src="super-admin-reports-common.js?v=20260723-1"></script>    <link rel="stylesheet" href="/three-d-surfaces.css">
  </head><body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><script>document.write(superAdminReportsCommon.pageChrome("Hotel Details","Hotel","Review one hotel's contact details, occupancy, and admin contact using the police-style layout."));</script><div class="p-5"><div class="space-y-4"><input id="superAdminToken" type="password" class="hidden"><div><label for="viewerName" class="mb-2 block text-sm font-medium text-slate-700">Viewer Name</label><input id="viewerName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><div><label for="hotelFilter" class="mb-2 block text-sm font-medium text-slate-700">Filter Hotels</label><input id="hotelFilter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none" placeholder="Search hotel name or hotel ID"></div><div><label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label><select id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><option value="">Load hotels</option></select></div><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none"></div><button id="loadButton" type="button" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean-950 px-5 py-3 font-semibold text-white">Load Hotel Details</button><div id="statusBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><div id="detailsBox" class="mt-5 rounded-[1.5rem] border border-slate-200 bg-slate-50 p-4 text-sm text-slate-600">No data loaded yet.</div></div></section></main><script>const tokenInput=document.getElementById("superAdminToken"),viewerNameInput=document.getElementById("viewerName"),hotelFilterInput=document.getElementById("hotelFilter"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),statusBox=document.getElementById("statusBox"),detailsBox=document.getElementById("detailsBox");let hotels=[];superAdminReportsCommon.hydrateFilters(tokenInput,viewerNameInput,fromDateInput,toDateInput);hotelIdInput.dataset.preselectedHotelId=new URLSearchParams(window.location.search).get("hotel_id")||localStorage.getItem("super_admin_police_hotel_id")||"";async function initHotels(){hotels=await superAdminReportsCommon.loadHotels();superAdminReportsCommon.renderHotelOptions(hotelIdInput,hotels);superAdminReportsCommon.attachHotelFilter(hotelFilterInput,hotelIdInput,hotels);}function renderHotel(data){const h=data.hotel,s=data.summary;detailsBox.innerHTML=`<p class="text-base font-semibold text-ocean-950">${h.name}</p>${superAdminReportsCommon.createLine("Hotel ID",h.id)}${superAdminReportsCommon.createLine("Contact",h.contact||"-")}${superAdminReportsCommon.createLine("Address",h.address||"-")}${superAdminReportsCommon.createLine("Admin Email",h.admin_email||"-")}${superAdminReportsCommon.createLine("Admin Phone",h.admin_phone||"-")}${superAdminReportsCommon.createLine("Occupied Rooms",`${s.occupied_rooms} / ${s.total_rooms}`)}${superAdminReportsCommon.createLine("Current Guests",s.current_in_house_guests)}${superAdminReportsCommon.createLine("Active Staff",s.active_staff)}`;}async function loadData(){const data=await superAdminReportsCommon.loadHotelReport({tokenInput,viewerNameInput,hotelIdInput,fromDateInput,toDateInput});renderHotel(data);}loadButton.addEventListener("click",async()=>{superAdminReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadData();}catch(error){superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load hotel details","error");}finally{superAdminReportsCommon.setButtonLoading(loadButton,false);}});initHotels().catch((error)=>superAdminReportsCommon.setMessage(statusBox,error instanceof Error?error.message:"Unable to load hotels","error"));</script></body></html>
