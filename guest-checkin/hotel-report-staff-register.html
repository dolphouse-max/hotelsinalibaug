<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Register</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js?v=20260718-1"></script><script src="hotel-reports-common.js?v=20260718-1"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script></head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Staff</span></div><script>document.write(hotelReportsCommon.quickNav("staff"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 class="text-2xl font-semibold">Staff Register</h1><p class="mt-2 text-sm leading-6 text-white/80">Search the staff list and export only the filtered rows.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelAdminToken" type="password" placeholder="Hotel Admin Token" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="staffFilter" placeholder="Search staff, role, phone, or status" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th class="px-3 py-2 font-medium">Staff</th><th class="px-3 py-2 font-medium">Role</th><th class="px-3 py-2 font-medium">Phone</th><th class="px-3 py-2 font-medium">Status</th><th class="px-3 py-2 font-medium">Working Since</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=document.getElementById("hotelAdminToken"),hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),staffFilter=document.getElementById("staffFilter"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let lastData=null;hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);function normalize(v){return String(v||"").trim().toLowerCase();}function filteredRows(rows){const q=normalize(staffFilter.value);if(!q){return rows;}return rows.filter((staff)=>{const status=Number(staff.is_active)===1?"active":"inactive";return [staff.full_name,staff.role,staff.phone,status].filter(Boolean).some((value)=>normalize(value).includes(q));});}function renderRows(rows){const filtered=filteredRows(rows);stateBox.textContent=`${filtered.length} staff row${filtered.length===1?"":"s"} loaded.`;hotelReportsCommon.renderTable(tableBox,filtered.map((staff)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean">${staff.full_name}</td><td class="px-3 py-3 text-slate-600">${staff.role||"-"}</td><td class="px-3 py-3 text-slate-600">${staff.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${Number(staff.is_active)===1?"Active":"Inactive"}</td><td class="px-3 py-3 text-slate-600">${staff.working_since_month||"-"} ${staff.working_since_year||""}</td>`;return tr;}),5,"No staff rows found.");}async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.staff||[]);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,"Loading...");try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:"Unable to load report","error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);}});exportButton.addEventListener("click",()=>{if(!lastData?.reports?.staff?.length){hotelReportsCommon.setMessage(messageBox,"There is no data to export yet.","error");return;}const rows=[["Staff Name","Role","Phone","Status","Working Since Month","Working Since Year"]];for(const staff of filteredRows(lastData.reports.staff)){rows.push([staff.full_name,staff.role,staff.phone,Number(staff.is_active)===1?"Active":"Inactive",staff.working_since_month,staff.working_since_year]);}hotelReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-staff-register.csv`,rows);});staffFilter.addEventListener("input",()=>{if(lastData?.reports?.staff){renderRows(lastData.reports.staff);}});</script></body></html>
