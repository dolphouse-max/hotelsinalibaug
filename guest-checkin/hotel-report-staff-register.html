<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Staff Register</title><script src="https://cdn.tailwindcss.com"></script><script src="hotel-admin-common.js?v=20260725-2"></script><script src="hotel-reports-common.js?v=20260718-1"></script><script>tailwind.config={theme:{extend:{colors:{ocean:"#0b1824",harbor:"#17324a"}}}};</script>    <link rel="stylesheet" href="/three-d-surfaces.css">
  </head>
<body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900"><main class="mx-auto max-w-md px-4 py-5 pb-10"><div class="flex items-center justify-between text-sm"><a id="backLink" href="/hotel-reports-home.html" class="font-medium text-slate-600">Back to Reports Home</a><span id="badge" class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Staff</span></div><script>document.write(hotelReportsCommon.quickNav("staff"));</script><section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]"><div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white"><h1 id="heroTitle" class="text-2xl font-semibold">Staff Register</h1><p id="heroBody" class="mt-2 text-sm leading-6 text-white/80">Search the staff list and export only the filtered rows.</p></div><div class="p-5"><div class="space-y-4"><input id="hotelId" placeholder="Hotel ID" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div class="grid grid-cols-2 gap-3"><input id="fromDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><input id="toDate" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"></div><div class="grid grid-cols-2 gap-3"><button id="loadButton" type="button" class="inline-flex items-center justify-center rounded-2xl bg-ocean px-5 py-3 font-semibold text-white">Load Report</button><button id="exportButton" type="button" class="inline-flex items-center justify-center rounded-2xl border border-slate-200 bg-white px-5 py-3 font-semibold text-slate-700">Export CSV</button></div><input id="staffFilter" placeholder="Search staff, role, phone, or status" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10"><div id="messageBox" class="hidden rounded-2xl border px-4 py-3 text-sm"></div></div><p id="stateBox" class="mt-5 text-sm text-slate-600">No data loaded yet.</p><div class="mt-4 overflow-x-auto rounded-[1.5rem] border border-slate-200 bg-white"><table class="min-w-full text-left text-sm"><thead class="text-slate-500"><tr><th id="thStaff" class="px-3 py-2 font-medium">Staff</th><th id="thRole" class="px-3 py-2 font-medium">Role</th><th id="thPhone" class="px-3 py-2 font-medium">Phone</th><th id="thStatus" class="px-3 py-2 font-medium">Status</th><th id="thWorking" class="px-3 py-2 font-medium">Working Since</th></tr></thead><tbody id="tableBox" class="divide-y divide-slate-100"></tbody></table></div></div></section></main><script>const tokenInput=null,hotelIdInput=document.getElementById("hotelId"),fromDateInput=document.getElementById("fromDate"),toDateInput=document.getElementById("toDate"),loadButton=document.getElementById("loadButton"),exportButton=document.getElementById("exportButton"),staffFilter=document.getElementById("staffFilter"),messageBox=document.getElementById("messageBox"),stateBox=document.getElementById("stateBox"),tableBox=document.getElementById("tableBox");let lastData=null;const pageText={en:{title:"Staff Register",back:"Back to Reports Home",badge:"Staff",heroTitle:"Staff Register",heroBody:"Search the staff list and export only the filtered rows.",hotelId:"Hotel ID",load:"Load Report",export:"Export CSV",filter:"Search staff, role, phone, or status",emptyStart:"No data loaded yet.",rows:(c)=>`${c} staff row${c===1?"":"s"} loaded.`,empty:"No staff rows found.",noExport:"There is no data to export yet.",staff:"Staff",role:"Role",phone:"Phone",status:"Status",working:"Working Since",active:"Active",inactive:"Inactive",staffName:"Staff Name",workingMonth:"Working Since Month",workingYear:"Working Since Year",loading:"Loading...",error:"Unable to load report"},mr:{title:"स्टाफ रजिस्टर",back:"रिपोर्ट्स मुख्यपृष्ठावर परत",badge:"स्टाफ",heroTitle:"स्टाफ रजिस्टर",heroBody:"स्टाफ यादी शोधा आणि फक्त फिल्टर केलेल्या नोंदी निर्यात करा.",hotelId:"हॉटेल आयडी",load:"रिपोर्ट लोड करा",export:"सीएसव्ही निर्यात",filter:"स्टाफ, भूमिका, फोन किंवा स्थिती शोधा",emptyStart:"अजून माहिती लोड केलेली नाही.",rows:(c)=>`${c} स्टाफ नोंदी लोड झाल्या.`,empty:"कोणतीही स्टाफ नोंद सापडली नाही.",noExport:"निर्यात करण्यासाठी अजून माहिती नाही.",staff:"स्टाफ",role:"भूमिका",phone:"फोन",status:"स्थिती",working:"काम सुरू",active:"सक्रिय",inactive:"निष्क्रिय",staffName:"स्टाफ नाव",workingMonth:"काम सुरू महिना",workingYear:"काम सुरू वर्ष",loading:"लोड होत आहे...",error:"रिपोर्ट लोड करता आला नाही"}};hotelReportsCommon.hydrateFilters(tokenInput,hotelIdInput,fromDateInput,toDateInput);function t(){return pageText[hotelAdminCommon.getLanguage()]||pageText.en;}function applyLanguage(){const x=t();document.title=x.title;backLink.textContent=x.back;badge.textContent=x.badge;heroTitle.textContent=x.heroTitle;heroBody.textContent=x.heroBody;hotelIdInput.placeholder=x.hotelId;staffFilter.placeholder=x.filter;thStaff.textContent=x.staff;thRole.textContent=x.role;thPhone.textContent=x.phone;thStatus.textContent=x.status;thWorking.textContent=x.working;if(!loadButton.dataset.loading){loadButton.textContent=x.load;}exportButton.textContent=x.export;if(!lastData){stateBox.textContent=x.emptyStart;}}function normalize(v){return String(v||"").trim().toLowerCase();}function filteredRows(rows){const x=t(),q=normalize(staffFilter.value);if(!q){return rows;}return rows.filter((staff)=>{const status=Number(staff.is_active)===1?x.active:x.inactive;return [staff.full_name,staff.role,staff.phone,status].filter(Boolean).some((value)=>normalize(value).includes(q));});}function renderRows(rows){const x=t(),filtered=filteredRows(rows);stateBox.textContent=x.rows(filtered.length);hotelReportsCommon.renderTable(tableBox,filtered.map((staff)=>{const tr=document.createElement("tr");tr.innerHTML=`<td class="px-3 py-3 font-medium text-ocean">${staff.full_name}</td><td class="px-3 py-3 text-slate-600">${staff.role||"-"}</td><td class="px-3 py-3 text-slate-600">${staff.phone||"-"}</td><td class="px-3 py-3 text-slate-600">${Number(staff.is_active)===1?x.active:x.inactive}</td><td class="px-3 py-3 text-slate-600">${staff.working_since_month||"-"} ${staff.working_since_year||""}</td>`;return tr;}),5,x.empty);}async function loadSection(){hotelReportsCommon.clearMessage(messageBox);const data=await hotelReportsCommon.loadReport({tokenInput,hotelIdInput,fromDateInput,toDateInput});lastData=data;renderRows(data.reports.staff||[]);}loadButton.addEventListener("click",async()=>{hotelReportsCommon.setButtonLoading(loadButton,true,t().loading);try{await loadSection();}catch(error){hotelReportsCommon.setMessage(messageBox,error instanceof Error?error.message:t().error,"error");}finally{hotelReportsCommon.setButtonLoading(loadButton,false);loadButton.textContent=t().load;}});exportButton.addEventListener("click",()=>{const x=t();if(!lastData?.reports?.staff?.length){hotelReportsCommon.setMessage(messageBox,x.noExport,"error");return;}const rows=[[x.staffName,x.role,x.phone,x.status,x.workingMonth,x.workingYear]];for(const staff of filteredRows(lastData.reports.staff)){rows.push([staff.full_name,staff.role,staff.phone,Number(staff.is_active)===1?x.active:x.inactive,staff.working_since_month,staff.working_since_year]);}hotelReportsCommon.downloadCsv(`${hotelIdInput.value.trim()||"hotel"}-staff-register.csv`,rows);});staffFilter.addEventListener("input",()=>{if(lastData?.reports?.staff){renderRows(lastData.reports.staff);}});document.addEventListener("click",(event)=>{if(event.target instanceof HTMLElement&&event.target.closest(".hotel-language-button")){window.setTimeout(()=>{applyLanguage();if(lastData?.reports?.staff){renderRows(lastData.reports.staff);}},0);}});applyLanguage();if(hotelIdInput.value.trim()){loadButton.click();}</script></body></html>
