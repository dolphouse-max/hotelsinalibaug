<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Profile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="hotel-admin-common.js?v=20260725-2"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              ocean: "#0b1824",
              harbor: "#17324a",
              shell: "#f6efe3",
              breeze: "#9bc8c2",
              sunset: "#dc8f67",
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-[linear-gradient(180deg,#f7fafc_0%,#edf3f8_100%)] text-slate-900">
    <main class="mx-auto max-w-md px-4 py-5 pb-10">
      <div class="flex items-center justify-between text-sm">
        <a id="profileBackLink" href="/hotel-admin-home.html" class="font-medium text-slate-600">Back to Home</a>
        <span id="profileBadge" class="rounded-full bg-white px-3 py-1 text-xs font-semibold uppercase tracking-[0.18em] text-slate-500 shadow-sm">Profile</span>
      </div>
      <script>
        document.write(hotelAdminCommon.quickNav("profile"));
      </script>
      <section class="mt-3 overflow-hidden rounded-[2rem] border border-slate-200 bg-white shadow-[0_24px_70px_rgba(15,23,42,0.08)]">
        <div class="bg-[linear-gradient(135deg,#0b1824_0%,#17324a_68%,#244767_100%)] px-5 py-6 text-white">
          <h1 id="profileHeroTitle" class="text-2xl font-semibold">Profile & Subscription</h1>
          <p id="profileHeroBody" class="mt-2 text-sm leading-6 text-white/80">Review your hotel account, keep contact details current, and make sure room counts stay accurate.</p>
        </div>

        <div class="p-5">
          <div id="profileIntro" class="mb-4 rounded-[1.5rem] border border-slate-200 bg-slate-50 px-4 py-4 text-sm text-slate-600">
            Use this page only for hotel details, room counts, and checking the current paid-through date.
          </div>
          <div class="space-y-4">
            <div>
              <label for="hotelAdminToken" class="mb-2 block text-sm font-medium text-slate-700">Session</label>
              <input id="hotelAdminToken" type="password" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Saved hotel-admin session">
            </div>
            <div class="grid gap-3 sm:grid-cols-[1fr_auto]">
              <div>
                <label for="hotelId" class="mb-2 block text-sm font-medium text-slate-700">Hotel ID</label>
                <input id="hotelId" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Hotel ID">
              </div>
              <button id="loadButton" type="button" class="rounded-2xl bg-ocean px-5 py-3 font-semibold text-white sm:self-end">Load Hotel</button>
            </div>
          </div>
          <div id="pageMessage" class="hidden rounded-2xl border px-4 py-3 text-sm"></div>

          <div class="mt-5 grid gap-3 sm:grid-cols-2">
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-sm text-slate-500">Account Status</p>
              <p id="accountStatus" class="mt-1 font-semibold text-slate-900">Not loaded</p>
            </div>
            <div class="rounded-2xl border border-slate-200 bg-slate-50 p-4">
              <p class="text-sm text-slate-500">Paid Through</p>
              <p id="paidThrough" class="mt-1 font-semibold text-slate-900">Not loaded</p>
            </div>
          </div>

          <form id="profileForm" class="mt-5 space-y-4">
            <div>
              <label for="hotelName" class="mb-2 block text-sm font-medium text-slate-700">Hotel Name</label>
              <input id="hotelName" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Hotel Name">
            </div>
            <div>
              <label for="contact" class="mb-2 block text-sm font-medium text-slate-700">Mobile Number</label>
              <input id="contact" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Mobile Number">
            </div>
            <div>
              <label for="adminEmail" class="mb-2 block text-sm font-medium text-slate-700">Hotel Admin Gmail</label>
              <input id="adminEmail" type="email" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="booking@gmail.com">
            </div>
            <div class="grid gap-3">
              <div>
                <label for="addressHouseStreet" class="mb-2 block text-sm font-medium text-slate-700">Address: House No. / Street</label>
                <input id="addressHouseStreet" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Keep blank if not needed">
              </div>
              <div>
                <label for="addressVillage" class="mb-2 block text-sm font-medium text-slate-700">Village</label>
                <input id="addressVillage" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Keep blank if not needed">
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label for="addressTaluka" class="mb-2 block text-sm font-medium text-slate-700">Taluka</label>
                  <input id="addressTaluka" value="Alibaug" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10">
                </div>
                <div>
                  <label for="addressDistrict" class="mb-2 block text-sm font-medium text-slate-700">District</label>
                  <input id="addressDistrict" value="Raigad" class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none">
                </div>
              </div>
              <div>
                <label for="addressPincode" class="mb-2 block text-sm font-medium text-slate-700">Pincode</label>
                <input id="addressPincode" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="Keep blank if not needed">
              </div>
            </div>
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label for="totalRooms" class="mb-2 block text-sm font-medium text-slate-700">Total Rooms</label>
                <input id="totalRooms" type="number" min="0" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="0">
              </div>
              <div>
                <label for="occupiedRooms" class="mb-2 block text-sm font-medium text-slate-700">Occupied Rooms</label>
                <input id="occupiedRooms" type="number" min="0" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 outline-none focus:border-harbor focus:ring-4 focus:ring-harbor/10" placeholder="0">
              </div>
            </div>
            <button id="saveButton" type="submit" class="inline-flex w-full items-center justify-center rounded-2xl bg-ocean px-5 py-4 font-semibold text-white shadow-lg shadow-ocean/15">
              Save Profile
            </button>
          </form>
        </div>
      </section>
    </main>

    <script>
      const tokenInput = document.getElementById("hotelAdminToken");
      const hotelIdInput = document.getElementById("hotelId");
      const pageMessage = document.getElementById("pageMessage");
      const loadButton = document.getElementById("loadButton");
      const saveButton = document.getElementById("saveButton");

      const profileTranslations = {
        en: {
          title: "Hotel Profile",
          back: "Back to Home",
          badge: "Profile",
          heroTitle: "Profile & Subscription",
          heroBody: "Review your hotel account, keep contact details current, and make sure room counts stay accurate.",
          intro: "Use this page only for hotel details, room counts, and checking the current paid-through date.",
          notSet: "Not set",
          active: "Active",
          inactive: "Inactive",
          loadSaving: "Loading...",
          saveSaving: "Saving...",
          saved: "Hotel profile updated successfully.",
          saveError: "Unable to save profile",
        },
        mr: {
          title: "हॉटेल प्रोफाइल",
          back: "मुख्यपृष्ठावर परत",
          badge: "प्रोफाइल",
          heroTitle: "प्रोफाइल आणि सदस्यता",
          heroBody: "आपले हॉटेल खाते तपासा, संपर्क माहिती अद्ययावत ठेवा आणि रूम संख्या अचूक आहे याची खात्री करा.",
          intro: "हे पान फक्त हॉटेलची माहिती, रूम संख्या आणि सध्याची सशुल्क अंतिम तारीख तपासण्यासाठी वापरा.",
          notSet: "सेट नाही",
          active: "सक्रिय",
          inactive: "निष्क्रिय",
          loadSaving: "लोड होत आहे...",
          saveSaving: "जतन होत आहे...",
          saved: "हॉटेल प्रोफाइल यशस्वीरीत्या अद्ययावत झाले.",
          saveError: "प्रोफाइल जतन करता आले नाही.",
        },
      };

      function applyProfileLanguage() {
        const text = profileTranslations[hotelAdminCommon.getLanguage()] || profileTranslations.en;
        const shared = hotelAdminCommon.getPageTranslations
          ? (hotelAdminCommon.getPageTranslations("/hotel-admin-profile.html", hotelAdminCommon.getLanguage()) || {})
          : {};
        document.title = text.title;
        document.getElementById("profileBackLink").textContent = text.back;
        document.getElementById("profileBadge").textContent = text.badge;
        document.getElementById("profileHeroTitle").textContent = text.heroTitle;
        document.getElementById("profileHeroBody").textContent = text.heroBody;
        document.getElementById("profileIntro").textContent = text.intro;
        document.querySelector("label[for='hotelAdminToken']").textContent = shared.sessionLabel || "Session";
        document.querySelector("label[for='hotelId']").textContent = shared.hotelIdLabel || "Hotel ID";
        document.getElementById("loadButton").textContent = shared.loadButton || "Load Hotel";
        document.querySelectorAll(".rounded-2xl.border.border-slate-200.bg-slate-50.p-4 .text-sm.text-slate-500")[0].textContent = shared.accountStatusLabel || "Account Status";
        document.querySelectorAll(".rounded-2xl.border.border-slate-200.bg-slate-50.p-4 .text-sm.text-slate-500")[1].textContent = shared.paidThroughLabel || "Paid Through";
        document.querySelector("label[for='hotelName']").textContent = shared.hotelNameLabel || "Hotel Name";
        document.querySelector("label[for='contact']").textContent = shared.contactLabel || "Mobile Number";
        document.querySelector("label[for='adminEmail']").textContent = shared.adminEmailLabel || "Hotel Admin Gmail";
        document.querySelector("label[for='addressHouseStreet']").textContent = shared.addressHouseStreetLabel || "Address: House No. / Street";
        document.querySelector("label[for='addressVillage']").textContent = shared.addressVillageLabel || "Village";
        document.querySelector("label[for='addressTaluka']").textContent = shared.addressTalukaLabel || "Taluka";
        document.querySelector("label[for='addressDistrict']").textContent = shared.addressDistrictLabel || "District";
        document.querySelector("label[for='addressPincode']").textContent = shared.addressPincodeLabel || "Pincode";
        document.querySelector("label[for='totalRooms']").textContent = shared.totalRoomsLabel || "Total Rooms";
        document.querySelector("label[for='occupiedRooms']").textContent = shared.occupiedRoomsLabel || "Occupied Rooms";
        document.getElementById("saveButton").textContent = shared.saveButton || "Save Profile";
      }

      applyProfileLanguage();
      hotelAdminCommon.hydrateContext(tokenInput, hotelIdInput);
      hotelIdInput.addEventListener("input", () => {
        hotelIdInput.value = hotelAdminCommon.normalizeHotelId(hotelIdInput.value);
      });

      function parseStructuredAddress(address) {
        const result = {
          houseStreet: "",
          village: "",
          taluka: "Alibaug",
          district: "Raigad",
          pincode: "",
        };

        const text = String(address || "").trim();
        if (!text) {
          return result;
        }

        const patterns = [
          ["houseStreet", /^House\/Street:\s*(.*)$/i],
          ["village", /^Village:\s*(.*)$/i],
          ["taluka", /^Taluka:\s*(.*)$/i],
          ["district", /^District:\s*(.*)$/i],
          ["pincode", /^Pincode:\s*(.*)$/i],
        ];

        let matchedStructured = false;
        for (const line of text.split(/\r?\n/)) {
          for (const [key, pattern] of patterns) {
            const match = line.match(pattern);
            if (match) {
              result[key] = match[1].trim();
              matchedStructured = true;
            }
          }
        }

        if (!matchedStructured) {
          result.houseStreet = text;
        }

        if (!result.taluka) {
          result.taluka = "Alibaug";
        }
        if (!result.district) {
          result.district = "Raigad";
        }

        return result;
      }

      function fill(hotel) {
        const language = hotelAdminCommon.getLanguage();
        const text = profileTranslations[hotelAdminCommon.getLanguage()] || profileTranslations.en;
        const address = parseStructuredAddress(hotel.address);
        hotelIdInput.value = hotel.id || hotelIdInput.value;
        document.getElementById("hotelName").value = hotel.name || "";
        document.getElementById("contact").value = hotel.contact || "";
        document.getElementById("adminEmail").value = hotel.admin_email || "";
        document.getElementById("addressHouseStreet").value = address.houseStreet;
        document.getElementById("addressVillage").value = address.village;
        document.getElementById("addressTaluka").value = address.taluka;
        document.getElementById("addressDistrict").value = address.district;
        document.getElementById("addressPincode").value = address.pincode;
        document.getElementById("totalRooms").value = hotel.total_rooms ?? 0;
        document.getElementById("occupiedRooms").value = hotel.occupied_rooms ?? 0;
        document.getElementById("accountStatus").textContent = hotel.is_active === 1 ? text.active : text.inactive;
        document.getElementById("paidThrough").textContent = hotel.subscription_end_date || text.notSet;
      }

      async function loadHotel() {
        hotelAdminCommon.clearMessage(pageMessage);
        const hotel = await hotelAdminCommon.loadHotelProfile(tokenInput, hotelIdInput);
        fill(hotel);
        hotelAdminCommon.persistContext(tokenInput.value.trim(), hotelIdInput.value.trim());
      }

      document.getElementById("loadButton").addEventListener("click", async () => {
        const text = profileTranslations[hotelAdminCommon.getLanguage()] || profileTranslations.en;
        hotelAdminCommon.setButtonLoading(loadButton, true, text.loadSaving);
        try {
          await loadHotel();
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(loadButton, false);
        }
      });

      document.getElementById("profileForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        hotelAdminCommon.clearMessage(pageMessage);
        const text = profileTranslations[hotelAdminCommon.getLanguage()] || profileTranslations.en;
        hotelAdminCommon.setButtonLoading(saveButton, true, text.saveSaving);
        try {
          const response = await fetch("/api/hotel-admin/profile", {
            method: "PUT",
            headers: hotelAdminCommon.authHeaders(tokenInput),
            body: JSON.stringify({
              hotel_id: hotelIdInput.value.trim(),
              name: document.getElementById("hotelName").value.trim(),
              contact: document.getElementById("contact").value.trim(),
              admin_email: document.getElementById("adminEmail").value.trim(),
              address_house_street: document.getElementById("addressHouseStreet").value.trim(),
              address_village: document.getElementById("addressVillage").value.trim(),
              address_taluka: document.getElementById("addressTaluka").value.trim(),
              address_district: document.getElementById("addressDistrict").value.trim(),
              address_pincode: document.getElementById("addressPincode").value.trim(),
              total_rooms: Number(document.getElementById("totalRooms").value || "0"),
              occupied_rooms: Number(document.getElementById("occupiedRooms").value || "0"),
            }),
          });
          const data = await hotelAdminCommon.readJson(response);
          if (!response.ok) {
            throw new Error(data.error || text.saveError);
          }
          fill(data.hotel);
          hotelAdminCommon.persistContext(tokenInput.value.trim(), hotelIdInput.value.trim());
          hotelAdminCommon.setMessage(pageMessage, text.saved, "success");
        } catch (error) {
          hotelAdminCommon.setMessage(pageMessage, error.message, "error");
        } finally {
          hotelAdminCommon.setButtonLoading(saveButton, false);
        }
      });

      if (tokenInput.value.trim() && hotelIdInput.value.trim()) {
        loadHotel().catch(() => {});
      }
    </script>
  </body>
</html>
