<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Check-in Admin Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f1e8;
        --card: #fffdf9;
        --text: #1d2a26;
        --muted: #5a6a64;
        --line: #d8cbb7;
        --accent: #0d6b57;
        --accent-strong: #0a5645;
        --danger: #a4372f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background:
          radial-gradient(circle at top, rgba(13, 107, 87, 0.12), transparent 35%),
          linear-gradient(180deg, #f8f3ea 0%, var(--bg) 100%);
        color: var(--text);
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px 16px 48px;
      }

      .hero {
        padding: 12px 4px 20px;
      }

      h1 {
        margin: 0 0 8px;
        font-size: clamp(2rem, 5vw, 3.2rem);
        line-height: 1;
      }

      .hero p,
      .hint,
      .status {
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 16px;
      }

      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
        box-shadow: 0 16px 40px rgba(63, 45, 20, 0.06);
      }

      h2 {
        margin: 0 0 14px;
        font-size: 1.2rem;
      }

      label {
        display: block;
        margin: 0 0 12px;
        font-size: 0.95rem;
      }

      span {
        display: block;
        margin-bottom: 6px;
      }

      input,
      select,
      button {
        width: 100%;
        font: inherit;
        border-radius: 12px;
      }

      input,
      select {
        padding: 12px 14px;
        border: 1px solid var(--line);
        background: #fff;
        color: var(--text);
      }

      button {
        border: 0;
        padding: 13px 16px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }

      button:disabled {
        opacity: 0.65;
        cursor: wait;
      }

      .secondary {
        background: #efe6d6;
        color: var(--text);
      }

      .row {
        display: grid;
        gap: 12px;
      }

      .status {
        min-height: 24px;
        white-space: pre-wrap;
      }

      .ok {
        color: var(--accent-strong);
      }

      .error {
        color: var(--danger);
      }

      code {
        font-family: Consolas, "Courier New", monospace;
        font-size: 0.9em;
      }

      @media (min-width: 700px) {
        .row.two {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="hero">
        <h1>Check-in Admin Test</h1>
        <p>Connect a hotel to Google Drive, then submit a sample guest document upload from the same page.</p>
      </section>

      <div class="grid">
        <section class="card">
          <h2>Project Access</h2>
          <div class="row">
            <label>
              <span>API read token</span>
              <input id="apiToken" type="password" autocomplete="off" placeholder="Bearer token for protected test APIs">
            </label>
            <button id="healthButton" type="button" class="secondary">Check backend health</button>
            <div id="healthStatus" class="status"></div>
          </div>
        </section>

        <section class="card">
          <h2>Google Drive Connect</h2>
          <div class="row">
            <label>
              <span>Hotel ID</span>
              <input id="hotelId" type="text" autocomplete="off" placeholder="hotelalibaug0001">
            </label>
            <button id="connectButton" type="button">Connect hotel to Google Drive</button>
            <button id="statusButton" type="button" class="secondary">Check Drive status</button>
            <div id="driveStatus" class="status hint"></div>
          </div>
        </section>

        <section class="card">
          <h2>Guest Upload Test</h2>
          <form id="uploadForm">
            <div class="row two">
              <label>
                <span>Guest name</span>
                <input name="name" type="text" required>
              </label>
              <label>
                <span>Phone</span>
                <input name="phone" type="tel" required>
              </label>
            </div>
            <div class="row two">
              <label>
                <span>ID type</span>
                <select name="id_type" required>
                  <option value="aadhaar">Aadhaar</option>
                  <option value="passport">Passport</option>
                  <option value="driving_licence">Driving Licence</option>
                  <option value="voter_id">Voter ID</option>
                </select>
              </label>
              <label>
                <span>ID number</span>
                <input name="id_number" type="text" required>
              </label>
            </div>
            <label>
              <span>ID image or PDF</span>
              <input name="file" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" required>
            </label>
            <button id="uploadButton" type="submit">Upload guest document</button>
          </form>
          <p class="hint">This posts to <code>/api/guests/upload</code> using <code>multipart/form-data</code>.</p>
          <div id="uploadStatus" class="status"></div>
        </section>
      </div>
    </main>

    <script>
      const apiTokenInput = document.getElementById("apiToken");
      const hotelIdInput = document.getElementById("hotelId");
      const healthButton = document.getElementById("healthButton");
      const connectButton = document.getElementById("connectButton");
      const statusButton = document.getElementById("statusButton");
      const uploadButton = document.getElementById("uploadButton");
      const uploadForm = document.getElementById("uploadForm");
      const healthStatus = document.getElementById("healthStatus");
      const driveStatus = document.getElementById("driveStatus");
      const uploadStatus = document.getElementById("uploadStatus");

      function tokenHeader() {
        const token = apiTokenInput.value.trim();
        return token ? { Authorization: `Bearer ${token}` } : {};
      }

      function setStatus(element, message, isError) {
        element.textContent = message;
        element.className = `status ${isError ? "error" : "ok"}`;
      }

      function requireHotelId() {
        const hotelId = hotelIdInput.value.trim();
        if (!hotelId) {
          throw new Error("Enter a hotel ID first.");
        }

        return hotelId;
      }

      async function readJson(response) {
        const text = await response.text();
        try {
          return text ? JSON.parse(text) : {};
        } catch {
          return { raw: text };
        }
      }

      healthButton.addEventListener("click", async () => {
        healthButton.disabled = true;
        setStatus(healthStatus, "Checking backend health...", false);

        try {
          const response = await fetch("/api/health", {
            headers: tokenHeader()
          });
          const data = await readJson(response);

          if (!response.ok) {
            throw new Error(data.error || "Health check failed.");
          }

          setStatus(
            healthStatus,
            `OK. Hotels: ${data.database.hotels}, Guests: ${data.database.guests}, Redirect URI configured: ${data.googleDrive.redirectUriConfigured}`,
            false
          );
        } catch (error) {
          setStatus(healthStatus, error.message || "Health check failed.", true);
        } finally {
          healthButton.disabled = false;
        }
      });

      connectButton.addEventListener("click", () => {
        try {
          const hotelId = requireHotelId();
          window.location.href = `/api/auth/google-init?hotel_id=${encodeURIComponent(hotelId)}`;
        } catch (error) {
          setStatus(driveStatus, error.message || "Unable to start Google OAuth.", true);
        }
      });

      statusButton.addEventListener("click", async () => {
        statusButton.disabled = true;
        setStatus(driveStatus, "Checking Google Drive status...", false);

        try {
          const hotelId = requireHotelId();
          const response = await fetch(`/api/auth/google-status?hotel_id=${encodeURIComponent(hotelId)}`, {
            headers: tokenHeader()
          });
          const data = await readJson(response);

          if (!response.ok) {
            throw new Error(data.error || "Unable to fetch Google Drive status.");
          }

          setStatus(
            driveStatus,
            data.googleDriveConnected
              ? `Connected. Folder ID: ${data.googleDriveFolderId}`
              : "Not connected yet.",
            false
          );
        } catch (error) {
          setStatus(driveStatus, error.message || "Unable to fetch Google Drive status.", true);
        } finally {
          statusButton.disabled = false;
        }
      });

      uploadForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        uploadButton.disabled = true;
        setStatus(uploadStatus, "Uploading guest document...", false);

        try {
          const hotelId = requireHotelId();
          const formData = new FormData(uploadForm);
          formData.set("hotel_id", hotelId);

          const response = await fetch("/api/guests/upload", {
            method: "POST",
            headers: tokenHeader(),
            body: formData
          });
          const data = await readJson(response);

          if (!response.ok) {
            throw new Error(data.error || "Guest upload failed.");
          }

          setStatus(
            uploadStatus,
            `Upload complete. Guest ID: ${data.guestId}, Drive file ID: ${data.googleDriveFileId}`,
            false
          );
          uploadForm.reset();
        } catch (error) {
          setStatus(uploadStatus, error.message || "Guest upload failed.", true);
        } finally {
          uploadButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
